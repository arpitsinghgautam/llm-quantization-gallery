<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="60" fill="#7B68EE" rx="4"/>
  <text x="20" y="38" font-family="monospace" font-size="22" font-weight="bold" fill="white">LC-QAT</text>
  <text x="780" y="38" font-family="monospace" font-size="16" fill="white" text-anchor="end">W2A16</text>

  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for LC-QAT -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W2A16</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-group vector quantization (gr…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  1,024 RedPajama samples for LDLQ …</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     GPU (NVIDIA A100; custom fused CU…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     yes</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     qat</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#7B68EE" opacity="0.08" stroke="#7B68EE" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">LC-QAT is a way to train large language models</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">down to 2 bits per weight while using only a</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">small slice of the data that earlier</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">quantization-aware training needed. Standard</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">QAT rounds each weight to a scalar value,</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">which falls apart badly at 2 bits; vector</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">Each group of d weights is quantized to a</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">vector c parameterized as an affine map c = A</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">z + B over discrete integer codes z in</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">{0,1,2,3}^d (a linear-constrained</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">reparameterization of vector quantization</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#7B68EE">https://arxiv.org/abs/2606.10531</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Haoyu Wang, Xingyu Yu, Haiyan Zhao</text>

</svg>
