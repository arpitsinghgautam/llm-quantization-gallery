  <text x="780" y="38" font-family="monospace" font-size="16" fill="white" text-anchor="end">W16A16KV2</text>

  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for OSCAR -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W16A16KV2</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-token affine asymmetric INT2 …</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  one-time offline calibration on a…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     GPU (fused Triton kernels for rot…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     kv_cache</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#3DAD78" opacity="0.08" stroke="#3DAD78" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">OSCAR is a post-training method for</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">compressing the KV cache of large language</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">models down to roughly 2 bits per element so</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">that long reasoning traces and 128K-token</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">contexts fit in far less memory. The core</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">observation is that what matters is not how</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">For each layer, OSCAR builds separate</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">rotations for keys and values by</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">eigendecomposing attention-aware target</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">covariances (the rotation for keys comes from</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">the query-side covariance C_Q = U_Q Lambda_Q</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#3DAD78">https://arxiv.org/abs/2605.17757</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Zhongzhu Zhou, Donglin Zhuang, Jisen Li</text>

</svg>
