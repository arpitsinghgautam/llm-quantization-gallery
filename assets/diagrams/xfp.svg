<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="60" fill="#4A90D9" rx="4"/>
  <text x="20" y="38" font-family="monospace" font-size="22" font-weight="bold" fill="white">XFP</text>
  <text x="780" y="38" font-family="monospace" font-size="16" fill="white" text-anchor="end">W3-W4 (~3.4 effective bits) A16</text>

  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for XFP -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W3-W4 (~3.4 effective bits) A16</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-channel learned codebooks (V2…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  none - no Hessian and no calibrat…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     NVIDIA GPU (RTX PRO 6000 Blackwel…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     ptq_weight_only</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#4A90D9" opacity="0.08" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">XFP is a weight-only quantizer that flips the</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">usual setup: instead of picking a bit-width,</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">the operator sets a target</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">reconstruction-quality floor expressed as</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">per-channel cosine similarity, and the method</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">itself decides how big each layer's codebook</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">XFP decomposes each weight matrix into a</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">sparse fp16 outlier residual plus a dense</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">sub-byte index tensor that points into a</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">learned per-group codebook. Codebook centroids</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">are fit with about 20 rounds of Lloyd</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#4A90D9">https://arxiv.org/abs/2605.14844</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Thomas Witt</text>

</svg>
