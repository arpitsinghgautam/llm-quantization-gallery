  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-token (activations); per-chan…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  small unlabeled calibration set u…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     GPU (INT4 inference; transforms a…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     ptq_weight_activation</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#E87D3E" opacity="0.08" stroke="#E87D3E" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">InfoQuant is a training-free post-training</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">method for running LLMs with 4-bit weights,</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">activations, and KV cache. Its starting point</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">is that simply making activations look</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">numerically smoother does not make them easy</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">to quantize: a low-bit uniform grid wastes</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">InfoQuant recasts activation transformation as</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">quantizer-facing distribution design. An</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">information-theoretic analysis of</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">uniform-quantizer error shows that</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">quantization-friendly activations should</text>

