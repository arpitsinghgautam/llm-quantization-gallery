<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="60" fill="#3DAD78" rx="4"/>
  <text x="20" y="38" font-family="monospace" font-size="22" font-weight="bold" fill="white">TriAxialKV</text>
  <text x="780" y="38" font-family="monospace" font-size="16" fill="white" text-anchor="end">W16A16KV2-KV4 mixed</text>

  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for TriAxialKV -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W16A16KV2-KV4 mixed</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-token mixed precision via tri…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  per-tag sensitivity calibration o…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     GPU (custom Triton decode kernels…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     kv_cache</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#3DAD78" opacity="0.08" stroke="#3DAD78" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">Agentic LLM workloads such as computer-use</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">agents build up very long KV caches because</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">they keep around screenshots, tool outputs,</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">and long histories. TriAxialKV compresses that</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">cache by giving each token a tag along three</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">axes: how recent it is, what modality it came</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">Each KV-cache token is assigned a triaxial tag</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">describing its temporal recency, its source</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">modality, and its semantic role in the agentic</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">trace. A calibration step measures per-tag</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">sensitivity and then a budgeted allocator</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#3DAD78">https://arxiv.org/abs/2605.17170</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Hanzhang Shen, Haoran Wu, Yiren Zhao</text>

</svg>
