  <text x="780" y="38" font-family="monospace" font-size="16" fill="white" text-anchor="end">W16A16KV2-KV4 mixed (avg ~3.17-bit)</text>

  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for WindowQuant -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W16A16KV2-KV4 mixed (avg ~3.17-bi…</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-window group-wise (default wi…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  sampled calibration set for windo…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     GPU</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     kv_cache</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#3DAD78" opacity="0.08" stroke="#3DAD78" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">WindowQuant compresses the key-value cache for</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">video-language models, where the KV cache is</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">dominated by large numbers of visual tokens.</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">Instead of quantizing every token uniformly or</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">token-by-token, it groups tokens into</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">fixed-size windows and assigns each window a</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">WindowQuant has two parts. (1) Window-level</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">quantization search: visual tokens are split</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">into windows (default 32 tokens); a similarity</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">score between each window and the text prompt</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">is computed, and windows are assigned</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#3DAD78">https://arxiv.org/abs/2605.02262</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Wei Tao, Xiaoyang Qu, Peiqiang Wang</text>

</svg>
