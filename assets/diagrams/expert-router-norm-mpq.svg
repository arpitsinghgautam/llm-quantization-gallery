  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#9B59B6" opacity="0.08" stroke="#9B59B6" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">This method assigns each expert in a</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">Mixture-of-Experts model its own weight</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">bit-width before deployment, rather than</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">quantizing every expert to the same precision.</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">The ranking signal is how much an expert's</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">router vector changes (in L2 norm) between the</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">For each expert s, define the change in router</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">L2 norm Lambda_s = |w_s^(T)| - |w_s^(0)| and</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">rank experts in ascending order, with</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">smaller-change experts placed higher (more</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">bits). The paper proves on a two-layer MoE</text>

