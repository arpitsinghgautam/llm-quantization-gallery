<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="60" fill="#E84393" rx="4"/>
  <text x="20" y="38" font-family="monospace" font-size="22" font-weight="bold" fill="white">LBLLM</text>
  <text x="780" y="38" font-family="monospace" font-size="16" fill="white" text-anchor="end">W(1+1)A4</text>

  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for LBLLM -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W(1+1)A4</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  group-wise, group size 128 (binar…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  small calibration/training corpus…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     single GPU</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     yes</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     extreme_lowbit</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#E84393" opacity="0.08" stroke="#E84393" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">LBLLM compresses LLM weights to roughly two</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">effective bits (one binary weight matrix plus</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">a one-bit per-group bitmap) while keeping</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">activations at 4 bits, and reaches usable</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">accuracy after fine-tuning on only 0.016B</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">tokens on a single GPU. Rather than learning</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">Each linear layer stores a binary weight</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">matrix together with a binary group-assignment</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">bitmap; the bitmap routes every weight to one</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">of two groups, each with its own learned scale</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">and offset, so two binary signals together</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#E84393">https://arxiv.org/abs/2604.19167</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Siqing Song, Chuang Wang, Yong Lang</text>

</svg>
