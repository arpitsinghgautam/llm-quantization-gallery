  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#4A90D9" opacity="0.08" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">GSQ is a weight-only, post-training quantizer</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">that keeps weights on a plain symmetric scalar</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">grid (so it runs on ordinary integer matmul</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">kernels) but learns where each weight lands</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">and how each group is scaled, instead of just</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">rounding. Starting from a GPTQ solution, it</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">Each weight's assignment to one of the 2^b</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">symmetric grid levels is modeled as a</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">categorical variable; a Gumbel-Softmax</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">relaxation makes these discrete assignments</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">differentiable, so the per-coordinate level</text>

