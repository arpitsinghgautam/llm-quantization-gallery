  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  FineWeb-Edu calibration set (~409…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     GPU; standard symmetric scalar la…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
