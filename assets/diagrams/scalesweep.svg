  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for ScaleSweep -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W4A4KV4 (NVFP4 / FP4)</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-block (NVFP4 blocks of 16 ele…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  calibration data used to set per-…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     NVIDIA Blackwell NVFP4 Tensor Cor…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     low_precision_training</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#D4A027" opacity="0.08" stroke="#D4A027" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">ScaleSweep is a post-training method for</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">quantizing LLMs into NVFP4, NVIDIA's FP4</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">format that pairs every block of 16 values</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">with an FP8 scale. Instead of setting each</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">block's scale to the block's maximum absolute</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">value (AbsMax), which is what current NVFP4</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">For each NVFP4 block, the per-block FP8 scale</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">determines how the 16 values are mapped onto</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">the E2M1 grid; AbsMax fixes this scale at the</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">block max, which is generally not the error-</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">minimizing choice. ScaleSweep instead treats</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#D4A027">https://arxiv.org/abs/2606.07618</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Li Lin, Xiaojun Wan</text>

</svg>
