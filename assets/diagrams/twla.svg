  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for TWLA -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W1.58A4</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-channel (row-wise) ternary we…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  small calibration set used to com…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     GPU inference; low-bit weight x l…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     extreme_lowbit</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#E84393" opacity="0.08" stroke="#E84393" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">TWLA is a post-training quantization recipe</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">that compresses large language models down to</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">ternary (1.58-bit) weights paired with 4-bit</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">activations, so both sides of every matrix</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">multiply run in low precision rather than</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">keeping activations in high precision. It</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">Three components work together. E2M-ATQ</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">(Euclidean-to-Manifold Asymmetric Ternary</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">Quantizer) ternarizes weights through a</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">two-stage optimization, starting from a</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">Euclidean-distance initialization and then</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#E84393">https://arxiv.org/abs/2606.13054</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Zhixiong Zhao, Zukang Xu, Zhixuan Chen</text>

</svg>
