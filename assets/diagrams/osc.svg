  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W4A4</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  group-wise (group sizes 16/32/64,…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  3 sequences of 512 tokens randoml…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     modern AI accelerator with FP16:F…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     ptq_weight_activation</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#E87D3E" opacity="0.08" stroke="#E87D3E" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">OSC is a post-training 4-bit weight and</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">activation quantization method that handles</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">the activation outliers which normally break</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">low-bit formats. It relies on the observation</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">that the largest outliers sit in the same</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">fixed set of channels across all tokens, so it</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">OSC runs a dual-path GEMM: a low-precision</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">4-bit path for ordinary activation channels</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">and a 16-bit branch path for outlier channels.</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">An offline group-wise profiling stage finds</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">the channels that persistently hold</text>

