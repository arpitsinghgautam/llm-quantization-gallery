  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#607D8B" opacity="0.08" stroke="#607D8B" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">LlamaWeb is a WebGPU backend for llama.cpp</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">that runs quantized language models entirely</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">inside a web browser across GPUs from many</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">different vendors. It cuts memory use by</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">allocating all the GPU buffers it needs once</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">at startup (instead of creating buffers on the</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">LlamaWeb adds a WebGPU device backend to</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">llama.cpp built around three pieces: (1)</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">static memory planning, where the full set of</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">GPU buffers required to run a model is</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">allocated up front into a single large buffer</text>

