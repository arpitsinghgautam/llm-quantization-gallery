  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for DiRotQ -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W4A4</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-token activations (rotated in…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  calibration set used to estimate …</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     NVIDIA GPU (INT4); reported on RT…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     ptq_weight_activation</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#E87D3E" opacity="0.08" stroke="#E87D3E" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">DiRotQ is a post-training scheme for running</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">diffusion transformers (image generators like</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">PixArt-Sigma and FLUX) with both weights and</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">activations at 4 bits. The trouble with 4-bit</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">activations in these models is that a few</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">directions in the activation space carry most</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">For each linear layer Y = XW, DiRotQ computes</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">a calibration-time PCA of the activations X</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">and forms an orthogonal rotation R whose</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">leading axes align with the principal (high-</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">variance) directions. Activations are rotated</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#E87D3E">https://arxiv.org/abs/2605.16732</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Sayeh Sharify, Mahsa Salmani, Hesham Mostafa</text>

</svg>
