  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#4A90D9" opacity="0.08" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">OSAQ is a preprocessing step for weight-only</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">LLM quantization that reshapes a layer's</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">weights so they are easier to round to very</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">low bit-widths. The authors notice that the</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">layer's Hessian (which measures how much each</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">weight direction affects the loss) is</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">OSAQ observes that the layer-wise Hessian H</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">exhibits low-rank consistency across</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">calibration inputs, so a stable set of</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">directions have vanishing curvature (the</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">Hessian null space). It constructs an additive</text>

