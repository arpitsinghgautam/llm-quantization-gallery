<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="60" fill="#4A90D9" rx="4"/>
  <text x="20" y="38" font-family="monospace" font-size="22" font-weight="bold" fill="white">OA-EM</text>
  <text x="780" y="38" font-family="monospace" font-size="16" fill="white" text-anchor="end">W2A16</text>

  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for OA-EM -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W2A16</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per 128-weight group via additive…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  C4 calibration set (~1024 sequenc…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     GPU (inherits AQLM's O(1) lookup-…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     ptq_weight_only</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#4A90D9" opacity="0.08" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">OA-EM tackles why additive (codebook)</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">quantization tends to collapse at 2 bits per</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">weight. The authors argue the real culprit is</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">not the search or the finetuning but the</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">starting point: the standard greedy,</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">sequential way of laying down the first</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">Additive quantization represents each weight</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">group as a sum of M codebook entries; the</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">quality of the final solution is largely fixed</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">by the initial codebook. OA-EM frames</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">initialisation as a clustering/assignment</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#4A90D9">https://arxiv.org/abs/2604.08118</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Ian W. Kennedy, Nafise Sadat Moosavi</text>

</svg>
