  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">ReSpinQuant targets the gap between two</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">families of rotation-based quantization.</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">Global- rotation methods use a single learned</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">rotation that can be folded into the weights</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">for free at inference, but one rotation for</text>
