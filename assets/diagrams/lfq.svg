  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">For all transformer blocks except the last,</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">LFQ keeps the usual per-block MSE</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">reconstruction used by the chosen base method</text>
