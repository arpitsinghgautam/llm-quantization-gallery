  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">LFQ is an add-on for block-wise weight-only</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">post-training quantization that targets the</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">quality drop low-bit LLMs suffer on open-ended</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">generation and long chain-of-thought tasks.</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">The authors observe that standard block</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">reconstruction has two blind spots: it never</text>

