  <text x="780" y="38" font-family="monospace" font-size="16" fill="white" text-anchor="end">W4A16, W8A16</text>

  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for TileFuse -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W4A16, W8A16</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  W4A16 asymmetric per-group (g=128…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  n/a (inference kernel library; co…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     AMD XDNA2 NPUs in Ryzen AI SoCs (…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     systems</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#607D8B" opacity="0.08" stroke="#607D8B" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">TileFuse is a kernel library that lets</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">already-quantized LLMs (in common AWQ-style</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">W4A16 and W8A16 formats from Hugging Face) run</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">efficiently on AMD's XDNA2 NPUs found in Ryzen</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">AI laptop chips. Instead of unpacking the</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">low-bit weights, dequantizing them, and then</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">TileFuse fuses weight unpacking</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">(bit-mask/shift to extract 4-bit fields),</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">dequantization (integer-to-BF16 using</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">per-group/per-channel scale and zero-point</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">metadata), and the GEMM/GEMV matmul into one</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#607D8B">https://arxiv.org/abs/2606.11357</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Wesley Pang, Gregory Hyegang Jun, Feiyang Liu</text>

</svg>
