  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">This method treats KV-cache precision as a</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">per-token budgeting problem rather than</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">picking one fixed bit-width for everything.</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">During decoding, a small learned controller</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">looks at four cheap signals for the current</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">token (entropy of the next-token distribution,</text>

