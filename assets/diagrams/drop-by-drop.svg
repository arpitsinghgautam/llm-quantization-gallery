  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">Drop-by-Drop trains one quantized copy of an</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">LLM's weights that can be run at several</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">different bit-widths without re-quantizing.</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">Weights are grouped (8 at a time) and</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">reconstructed as a sum of vectors pulled from</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">an ordered stack of learned codebooks, where</text>

