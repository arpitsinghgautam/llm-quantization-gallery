  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for MixFP4 -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W4A8</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  block of 16 elements (g=16) along…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  PTQ uses WikiText training split …</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     NVIDIA Blackwell Tensor Cores (NV…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     low_precision_training</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#D4A027" opacity="0.08" stroke="#D4A027" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">MixFP4 extends NVFP4 4-bit inference by</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">letting each 16-element block pick the 4-bit</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">number format that fits its values best.</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">Instead of forcing every block to use NVFP4's</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">E2M1 floating-point layout, a block can</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">instead use an E1M2 layout whose representable</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">Each block stores its 4-bit payloads in one of</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">two micro-formats: E2M1 (the standard NVFP4</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">layout, with non-uniform floating-point</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">spacing for wider dynamic range) or E1M2</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">(which yields uniform, INT4-like level</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#D4A027">https://arxiv.org/abs/2605.31035</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Jiaxiang Zou, Yonghao Chen, Ruilong Wu</text>

</svg>
