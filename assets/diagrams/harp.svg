  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W2/W3/W4 A16</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-group after learned two-sided…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  calibration set (rotation fitted …</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     GPU (structured sparse butterfly …</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     ptq_weight_only</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#4A90D9" opacity="0.08" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">HARP targets the rotation step used by</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">incoherence-based weight-only quantizers.</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">Methods like QuIP# and QTIP multiply weights</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">and inputs by a fixed randomized Hadamard</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">transform to smear out outliers before low-bit</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">quantization, but that fixed transform cannot</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">HARP replaces the fixed randomized Hadamard</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">transform (RHT) used in incoherence processing</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">with a learnable two-sided structured</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">orthogonal operator. Each rotation is</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">parameterized as a product of sparse</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#4A90D9">https://arxiv.org/abs/2605.29843</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Artur Zagitov, Gleb Molodtsov, Aleksandr Beznosikov</text>

</svg>
