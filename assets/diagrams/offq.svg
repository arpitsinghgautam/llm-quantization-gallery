  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for OffQ -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W4A4KV4</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-channel symmetric weights (GP…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  small calibration set used to est…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     NVIDIA GPU (INT4 Tensor Cores; un…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     ptq_weight_activation</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#E87D3E" opacity="0.08" stroke="#E87D3E" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">OffQ is a post-training method for running</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">large language models with 4-bit weights,</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">4-bit activations, and a 4-bit KV cache.</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">Activations contain a few extreme outlier</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">values that wreck low-bit quantization; OffQ</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">first uses a top-1 PCA to find the small</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">OffQ treats activation outliers as a</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">structured, low-rank phenomenon. A top-1 PCA</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">over calibration activations identifies the</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">dominant outlier direction, and an orthogonal</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">rotation aligns it so that nearly all outlier</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#E87D3E">https://arxiv.org/abs/2606.07116</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Haoqi Wang, Lorenz K. Mueller, Jiawei Zhuang</text>

</svg>
