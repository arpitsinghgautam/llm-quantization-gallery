  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for Bit-by-Bit -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W2A2 / W2A16</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-group (group size 32), E4M3 m…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  QAT on a 4096-sample RedPajama su…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     GPU (trained on NVIDIA H800; cust…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     yes</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     qat</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#7B68EE" opacity="0.08" stroke="#7B68EE" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">Bit-by-Bit is a training recipe for pushing</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">LLMs down to 2-bit weights and 2-bit</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">activations while keeping training stable.</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">Instead of quantizing straight to the target</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">bit-width, it lowers precision in stages block</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">by block so the model adapts gradually rather</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">Three components combine into one QAT</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">pipeline. (1) Block-wise progressive training:</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">precision is reduced stage by stage rather</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">than jumping to the target low bit-width,</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">limiting convergence instability and</text>

