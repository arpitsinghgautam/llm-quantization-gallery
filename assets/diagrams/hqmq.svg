  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W16A16KV4 (~3.79-5 effective bits…</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-(layer, head) codebook; 4-ele…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  none (calibration-free)</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     GPU (reduces KV-cache memory foot…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     kv_cache</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#3DAD78" opacity="0.08" stroke="#3DAD78" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">HQMQ compresses the KV cache of an LLM without</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">any calibration data or training. It splits</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">each key or value vector into chunks of four</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">numbers and treats each chunk as a quaternion,</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">separating it into a magnitude (the radius)</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">and a direction (a point on the unit</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">Each 4-element chunk x of K or V is written in</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">polar form x = r*u with radius r = ||x|| and</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">unit direction u in S^3. The direction is</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">quantized multiplicatively: u is matched to</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">the product q_p * q_s, where q_p ranges over</text>

