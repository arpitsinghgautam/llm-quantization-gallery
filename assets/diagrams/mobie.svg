  <text x="20" y="38" font-family="monospace" font-size="22" font-weight="bold" fill="white">MoBiE</text>
  <text x="780" y="38" font-family="monospace" font-size="16" fill="white" text-anchor="end">W1A16</text>

  <!-- Content area -->
  <rect x="0" y="60" width="800" height="440" fill="#F8F9FA" rx="0"/>


  <!-- Generic diagram for MoBiE -->
  <!-- Fact panel (left) -->
  <rect x="30" y="80" width="355" height="340" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="108" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Method Properties</text>
  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W1A16</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-expert (binary weights), with…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  calibration set used for Hessian/…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     GPU</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     moe</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#9B59B6" opacity="0.08" stroke="#9B59B6" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">MoBiE is a post-training method for squeezing</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">Mixture-of-Experts language models down to</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">1-bit weights. Plain binary methods built for</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">dense models stumble on MoE models for three</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">reasons: experts overlap a lot so binarizing</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">each one separately wastes bits, the usual</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">Three components address MoE-specific</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">binarization failures. (1) Joint SVD</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">decomposition is applied across experts to</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">remove cross-expert redundancy, so the shared</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">low-rank structure is captured cheaply and</text>

  <!-- Bottom -->
  <rect x="30" y="420" width="740" height="55" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="50" y="442" font-family="monospace" font-size="11" fill="#9B59B6">https://arxiv.org/abs/2604.06798v3</text>
  <text x="50" y="462" font-family="monospace" font-size="11" fill="#555">Year: 2026  |  Authors: Zhixiong Zhao, Zukang Xu, Zhixuan Chen</text>

</svg>
