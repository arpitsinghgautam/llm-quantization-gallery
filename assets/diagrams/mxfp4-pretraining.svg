  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">language models go unstable. The authors turn</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">on FP4 one piece at a time across the three</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">matrix multiplies in training (forward pass,</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">activation gradients, and weight gradients)</text>

