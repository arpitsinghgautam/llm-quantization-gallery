  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#4A90D9" opacity="0.08" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">ADMM-Q replaces GPTQ's greedy column-by-column</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">rounding with an operator-splitting solver</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">that adjusts every weight in a layer at once</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">to keep the layer's output close to the</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">original. It alternates between a continuous</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">update that lowers reconstruction error and a</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">ADMM-Q formulates layer-wise weight</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">quantization as a constrained least-squares</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">problem minimizing the Hessian-weighted</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">reconstruction error ||W - Ŵ||_H subject to Ŵ</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">lying on the quantization grid, then solves it</text>

