  <text x="50" y="132" font-family="monospace" font-size="11" fill="#555">Precision:    W1A16</text>
  <text x="50" y="152" font-family="monospace" font-size="11" fill="#555">Granularity:  per-channel scale for salient wei…</text>
  <text x="50" y="172" font-family="monospace" font-size="11" fill="#555">Calibration:  calibration set used to compute w…</text>
  <text x="50" y="192" font-family="monospace" font-size="11" fill="#555">Hardware:     GPU (reports 1.5x faster decoding…</text>
  <text x="50" y="212" font-family="monospace" font-size="11" fill="#555">Training:     no</text>
  <text x="50" y="232" font-family="monospace" font-size="11" fill="#555">Category:     extreme_lowbit</text>

  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#E84393" opacity="0.08" stroke="#E84393" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">SAGE-PTQ is a weight-only post-training method</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">that pushes average storage down to about 1.03</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">bits per weight by attacking an overlooked</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">cost: the bits spent on quantization scales</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">themselves. It splits each weight matrix into</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">a small salient set and a large unsalient set</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">The method observes that ultra-low-bit</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">quantizers spend a non-trivial fraction of</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">their storage on per-group scaling factors, so</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">it minimizes that hidden cost rather than only</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">the weight bits. Weights are partitioned into</text>

