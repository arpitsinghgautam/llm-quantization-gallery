  <!-- TL;DR -->
  <rect x="415" y="80" width="355" height="170" rx="6" fill="#D4A027" opacity="0.08" stroke="#D4A027" stroke-width="1.5"/>
  <text x="435" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#333">TL;DR</text>
  <text x="435" y="125" font-family="monospace" font-size="11" fill="#555">AGoQ is a training-time recipe that shrinks</text>
  <text x="435" y="145" font-family="monospace" font-size="11" fill="#555">the GPU memory footprint of distributed LLM</text>
  <text x="435" y="165" font-family="monospace" font-size="11" fill="#555">pretraining by storing the saved activations</text>
  <text x="435" y="185" font-family="monospace" font-size="11" fill="#555">and the gradients in low precision rather than</text>
  <text x="435" y="205" font-family="monospace" font-size="11" fill="#555">full BF16. Instead of using one fixed</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#555">bit-width everywhere, it inspects each</text>

  <!-- Key idea -->
  <rect x="415" y="260" width="355" height="150" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="435" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#333">Mechanism</text>
  <text x="435" y="305" font-family="monospace" font-size="11" fill="#555">AGoQ separates two memory consumers in</text>
  <text x="435" y="325" font-family="monospace" font-size="11" fill="#555">distributed LLM training and quantizes each.</text>
  <text x="435" y="345" font-family="monospace" font-size="11" fill="#555">(1) Activations saved for the backward pass</text>
  <text x="435" y="365" font-family="monospace" font-size="11" fill="#555">are compressed with a layer-aware allocation</text>
  <text x="435" y="385" font-family="monospace" font-size="11" fill="#555">algorithm that assigns different bit-widths to</text>

