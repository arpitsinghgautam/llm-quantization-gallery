  precision: "W16A16KV4 (~3.79-5 effective bits per KV element)"
  granularity: "per-(layer, head) codebook; 4-element chunks treated as quaternions; per-token-max radius scale"
  calibration: "none (calibration-free)"
  symmetric: "n/a (direction quantized to discrete codewords on S^3; radius via uniform scalar quantizer)"
  handles_outliers_via: "Med3x per-batch median-multiplier extraction: chunks with norm > C*median (C=3) stored as FP16 4-tuples"
  hardware_target: "GPU (reduces KV-cache memory footprint)"
  requires_training: false
  requires_calibration_data: false
  typical_degradation: "matches FP16 within 0.02-0.03 ppl at ~5 bits on Mistral-7B and Qwen3-8B (with Med3x, 0.02-0.10 ppl on Qwen2.5-7B/Qwen3-8B where naive INT4 collapses to 1e4+ ppl); zero-shot accuracy matches FP16 at 3.79 bits on Mistral-7B"
  tldr: >
    HQMQ compresses the KV cache of an LLM without any calibration data or training. It splits
    each key or value vector into chunks of four numbers and treats each chunk as a quaternion,
    separating it into a magnitude (the radius) and a direction (a point on the unit 3-sphere).
    The radius is quantized with a plain uniform scalar quantizer using a per-token-max scale,
    while the direction is snapped to one of a fixed set of points. Those points come from
    multiplying the 24 unit quaternions of the Hurwitz group (the corners of the 24-cell) by a
    small per-layer, per-head codebook of randomly drawn unit quaternions, so a codebook of S
    entries gives 24*S effective directions while only S need to be stored. Because left-
    multiplying by a unit quaternion is a rotation of the sphere, the random seed barely affects
    accuracy. A cheap per-batch step pulls out the few chunks whose norm exceeds three times the
    batch median and keeps them in FP16, which is enough to handle outlier-heavy architectures.
    The result is near-lossless KV compression down to roughly four bits per element, shrinking
    a 128k-context Llama-3-70B cache from 43 GB to 8.5 GB.
  key_idea: >
    Each 4-element chunk x of K or V is written in polar form x = r*u with radius r = ||x|| and
    unit direction u in S^3. The direction is quantized multiplicatively: u is matched to the
    product q_p * q_s, where q_p ranges over the 24-element Hurwitz group 2T (binary tetrahedral
    group; the 24 vertices of the 24-cell, pairwise 60 degrees apart) and q_s ranges over a
    per-(layer, head) secondary codebook of S random unit quaternions. This yields 24*S
    codewords from only S stored parameters; because left-multiplication is an S^3 isometry,
    random codebooks suffice and seed variation in end-task perplexity is under 1.5%. The radius
    is quantized separately with a uniform scalar quantizer (b_r in [3,6] bits, per-token-max
    scale). An outlier step (Med3x) marks any chunk whose norm exceeds C=3 times the per-batch
    median chunk norm and stores it as an FP16 4-tuple, with C=3 fixed across all models and no
    calibration.
  builds_on: ["rtn", "kivi"]
  superseded_by: []
  related: ["kivi", "kvquant", "rotatekv", "palu"]
  diagram: assets/diagrams/hqmq.svg
  diagram_caption: "Each 4-element KV chunk becomes a quaternion: radius scalar-quantized, direction snapped to the product of a 24-point Hurwitz group and a random per-head codebook (24S codes from S stored), with Med3x outlier chunks kept in FP16."

