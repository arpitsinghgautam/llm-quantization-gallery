  tldr: >
    Drop-by-Drop trains one quantized copy of an LLM's weights that can be run at several
    different bit-widths without re-quantizing. Weights are grouped (8 at a time) and
    reconstructed as a sum of vectors pulled from an ordered stack of learned codebooks, where
    each codebook adds roughly one bit. During training the codebooks are supervised so that the
    first few alone already give a usable reconstruction, the way nesting works in Matryoshka
    representations, so you can keep or drop trailing codebooks at inference to trade quality
    for memory. This means a single stored checkpoint covers 3-, 4-, and 5-bit operating points,
    and you pick the precision at load time based on the hardware budget.
  key_idea: >
    The method casts weight quantization as successive refinement: assuming weights are roughly
    Gaussian, an additive codebook code can be reconstructed with increasing fidelity as more
    codebooks (bits) are added under a weighted-MSE distortion tied to the LLM loss. Building on
    AQLM's additive-quantization pipeline, it injects Matryoshka-style supervision into the
    codebook-update objective so that ordered prefixes of the codebook set each minimize loss at
    their own bit-width. The result is nested, 'droppable' codebooks: at inference any prefix of
    length M yields a valid M-bit model, letting one trained checkpoint serve 3/4/5-bit
    precisions on demand.
