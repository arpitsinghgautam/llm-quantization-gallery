  tldr: >
    AGoQ is a training-time recipe that shrinks the GPU memory footprint of distributed LLM
    pretraining by storing the saved activations and the gradients in low precision rather than
    full BF16. Instead of using one fixed bit-width everywhere, it inspects each transformer
    block and pipeline stage and hands out activation bits according to how much each layer can
    tolerate, pushing average activation storage down toward 4 bits. Gradients are kept in 8
    bits and exchanged with an 8-bit All-Reduce that preserves precision, cutting both memory
    and inter-GPU communication time. Across LLaMA models from 8B to 32B parameters on clusters
    up to 64 GPUs, it reports up to 52% memory savings and up to 1.34x faster training versus
    Megatron-LM, COAT, and DeepSpeed with little convergence loss.
  key_idea: >
    AGoQ separates two memory consumers in distributed LLM training and quantizes each. (1)
    Activations saved for the backward pass are compressed with a layer-aware allocation
    algorithm that assigns different bit-widths to different transformer blocks based on layer
    type and pipeline-stage sensitivity, yielding an average near 4-bit activation store while
    keeping accuracy. (2) Gradients are quantized to 8 bits for both storage and communication,
    using a precision-preserving 8-bit All-Reduce so that the reduced gradients remain accurate
    enough for stable convergence. Weights and the optimizer master copy remain in BF16; the
    quantization touches only the stored activations and exchanged gradients, so memory and
    communication shrink without changing the model math materially.
