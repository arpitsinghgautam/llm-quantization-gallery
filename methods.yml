  tldr: >
    ConQuR is a post-training calibration method for low-bit weight-activation quantization of
    LLMs that tackles activation outliers using learned orthogonal rotations. Instead of
    training rotations with gradient descent over the orthogonal group or relying on large
    stored activation corpora, it frames the goal as aligning normalized activations with the
    corners of an inscribed hypercube so that activation energy is spread evenly across
    dimensions. This alignment objective has a closed-form solution through the orthogonal
    Procrustes problem, making each rotation update cheap. An online calibration loop refines
    the rotations as each calibration sample passes through, so activations never need to be
    written to disk and the rotations adapt to the quantized activation distribution.
  key_idea: >
    ConQuR learns per-layer orthogonal rotation matrices for activation quantization by
    minimizing the distance between normalized (rotated) activations and the corners of an
    inscribed hypercube, which encourages a balanced spread of magnitude across channels and
    reduces the dynamic range that outliers create. Because the target is a set of corner
    points, the optimal rotation is obtained in closed form via the orthogonal Procrustes
    problem (SVD of the cross-covariance), avoiding gradient-based optimization on the
    Stiefel/orthogonal manifold used by methods like SpinQuant. Calibration is performed online:
    rotations are incrementally updated as calibration samples stream through the network, so no
    activation corpus is stored and the rotations adapt to the actual quantized-activation
    statistics.
