  blog_url: null
  venue: null
  precision: "W2/W3 A16"
  granularity: "per-tile (2D tiling) low-rank factors + per-group residual quantization"
  calibration: "calibration set"
  symmetric: "asymmetric"
  handles_outliers_via: "LoPRo low-rank rotation (learned orthogonal transforms) before quantization"
  hardware_target: "GPU"
  requires_training: false
  requires_calibration_data: true
  typical_degradation: "WikiText-2 PPL 4.10 at 3-bit and 4.78 at 2-bit on Mixtral-8x7B (vs 3.87 FP16)"
  tldr: >
    TileQ compresses Mixture-of-Experts models by combining low-bit weight quantization (2-bit
    and 3-bit) with a low-rank correction term that recovers the lost accuracy. The key wrinkle
    is that the low-rank factors are laid out in 2D tiles so the same factors are reused across
    both the input and output dimensions of the expert weight matrices, which keeps the extra
    low-rank memory small instead of growing with every expert. Because each expert otherwise
    needs its own low-rank pass, TileQ also fuses the low-rank computations of the activated
    experts into one batched operation so the correction adds little latency at inference. It is
    a post-training method that needs only a calibration set and no fine-tuning, and the low-
    rank factors are stored in FP8 with FP16 singular values to keep their footprint down.
  key_idea: >
    Each quantized expert weight matrix is paired with a low-rank residual that compensates for
    quantization error, but instead of storing an independent rank-r factor per expert, TileQ
    arranges the low-rank factors in a 2D-tiled structure so factors are shared across the input
    and output dimensions of the experts, cutting the added low-rank memory by up to ~10x.
    Before quantization it applies LoPRo's learned low-rank rotations to suppress outliers, and
    the residual weights are quantized with GPTQ/GPTVQ-style per-group quantization. At
    inference the multiple per-expert low-rank corrections of the activated experts are fused
    into a single-pass batched operation, so the extra latency over the plain quantized forward
    pass is held to roughly 5% rather than the 50%+ overhead of element-wise low-rank methods.
  builds_on: ["gptq", "aqlm"]
  superseded_by: []
  related: ["moqe", "mc-moe", "gptq", "spqr"]
