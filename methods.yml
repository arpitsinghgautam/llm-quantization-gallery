    reasons: experts overlap a lot so binarizing each one separately wastes bits, the usual per-
    layer importance score ignores how a weight affects the overall loss, and crushing weights
    to one bit shifts which expert the router picks. MoBiE tackles each: it factorizes weights
    jointly across experts with SVD to strip shared redundancy before binarizing, blends global
    loss gradients into the local Hessian so salient weights are scored more accurately, and
    adds an error constraint tied to the input null space so the binarized weights perturb the
    router as little as possible. It does this without extra storage cost and reports large
    quality recovery over earlier binary baselines on Qwen3-30B-A3B.
  key_idea: >
    Three components address MoE-specific binarization failures. (1) Joint SVD decomposition is
    applied across experts to remove cross-expert redundancy, so the shared low-rank structure
    is captured cheaply and only residual, expert-unique weights are binarized. (2) Importance
    estimation integrates global loss gradients into the local Hessian metric, giving a saliency
    score that reflects each weight's effect on the end task rather than just local
    reconstruction error, which guides which weights are preserved during binarization. (3) An
    error constraint guided by the input null space steers binarization error into directions
    that do not change router decisions, suppressing quantization-induced routing shifts. The
    design adds no extra storage overhead.
  builds_on: ["billm", "gptq", "moqe"]
  superseded_by: []
  related: ["billm", "pb-llm", "onebit", "moqe", "mc-moe", "gptq"]
  diagram: assets/diagrams/mobie.svg
  diagram_caption: "MoBiE: cross-expert joint SVD strips shared redundancy, gradient-aware Hessian saliency guides 1-bit binarization, and null-space error constraint suppresses router shift in MoE LLMs."

- id: tileq
