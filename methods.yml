- id: ratequant
  name: "RateQuant"
  full_name: "RateQuant: Optimal Mixed-Precision KV Cache Quantization via Rate-Distortion Theory"
  category: kv_cache
  subcategory: "mixed-precision-bit-allocation"
  year: 2026
  date: 2026-04-22
  authors:
    - "Fei Zuo"
    - "Zikang Zhou"
    - "Hao Cong"
    - "Xiaoyan Xi"
    - "Ho Fai Leung"
  affiliation:
    - "unknown"
  paper_url: https://arxiv.org/abs/2605.06675
  code_url: null
  blog_url: null
  venue: "arXiv 2026"
  precision: "W16 A16 KV2-8 mixed (per-head, 2.5-6.0 average bits)"
  granularity: "per-head bit allocation (optionally separate keys/values, 2N components)"
  calibration: "16 WikiText-2 sequences (length 512) for gradient sensitivity plus a per-quantizer distortion-curve fit; ~1.6s for 8B, ~4.2s for 32B on one H200"
  symmetric: "mixed"
  handles_outliers_via: "inherits the base quantizer's outlier handling (e.g. QuaRot Hadamard rotations, KIVI per-token asymmetric values); RateQuant only allocates bits"
  hardware_target: "GPU (calibrated on NVIDIA H200); static ~2KB lookup table, zero inference overhead"
  requires_training: false
  requires_calibration_data: true
  typical_degradation: "Qwen3-8B WikiText-2 at 2.5 avg bits: lowers KIVI perplexity 49.3 -> 14.9; raises QuaRot by 6.6 PPL (34.88 -> 28.33); TurboQuant at 4.0 bits 9.94 -> 9.67 (FP16 baseline 9.53)"
  tldr: >
    RateQuant decides how many bits to give each attention head when compressing the key-value
    cache, instead of using the same bit-width everywhere. The authors observe that heads differ
    a lot in how much they matter, and that each underlying KV quantizer has its own error-
    versus-bits curve with a different decay rate. If you allocate bits using the wrong curve,
    the head ranking can flip and you end up worse than just using uniform bits, a failure they
    call distortion model mismatch. RateQuant measures each head's sensitivity and fits the
    actual distortion curve of whichever quantizer is in use from a tiny calibration set, then
    computes the bit assignment in closed form. It works as a layer on top of existing KV
    quantizers (KIVI, QuaRot, TurboQuant) and adds essentially no inference cost.
  key_idea: >
    RateQuant treats per-head KV-cache bit allocation as a rate-distortion problem. It estimates
    each head's importance with gradient-based sensitivity weights, fits a per-quantizer
    exponential distortion model D(b)=alpha*beta^(-b) from a small calibration pass, and then
    solves for the optimal per-head bit count using a reverse-waterfilling result: b*_i = b_bar
    + (ln w_i - ln w_bar)/ln beta, with a greedy integer rounding step (assign each next bit to
    the head with maximum marginal distortion reduction). Because beta is measured for the
    specific base quantizer rather than assumed, RateQuant avoids distortion model mismatch
    where applying one quantizer's decay rate to another inverts the head ranking and hurts
