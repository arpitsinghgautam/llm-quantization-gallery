  tldr: >
    Large reasoning models earn their accuracy through very long chains of generated tokens, so
    per-token decoding cost dominates deployment. The authors find that standard weight-
    quantization recipes, even end-to-end quantization-aware training, keep perplexity and
    short-answer accuracy intact but quietly lose accuracy on long reasoning tasks. A gradient-
    direction analysis traces this to two causes: end-to-end supervision under-weights the KV-
    cache fidelity that the attention softmax depends on, and the calibration data sits in a
    different Hessian subspace than the deployment workload. LAQuant is a layer-wise, weight-
    only quantization-aware training method that fixes both by calibrating on reasoning traces
    and training each layer with a one-layer lookahead loss, all without adding any inference-
    time transform. On Qwen3-4B at 3-bit it recovers most of the lost reasoning accuracy while
    keeping a large decoding speedup.
  key_idea: >
    Instead of training the whole network end-to-end against the final loss, LAQuant quantizes
    weights layer by layer and supervises each layer with a 'one-layer lookahead loss': the
    quantized layer's output is pushed not just to match its own teacher output but to keep the
    next layer's residual stream intact. This implicit cross-layer co-adaptation preserves the
    KV-cache fidelity that the softmax Fisher metric makes the attention mechanism sensitive to,
    which end-to-end QAT supervision tends to attenuate. Combined with reasoning-domain
    calibration data (so the calibration Hessian subspace aligns with the deployment
    distribution), the method targets the two failure modes identified via gradient-direction
    analysis. Because it is weight-only and adds no online transform, the quantized model has no
    inference-time overhead.
