  tldr: >
    LiftQuant is a post-training, weights-only quantization method that lets you pick almost any
    target average bit-width instead of being locked to whole numbers like 2, 3, or 4 bits. It
    represents each low-dimensional block of weights by projecting a simple 1-bit lattice down
    from a higher-dimensional 'lifted' space, so the bit budget is just the ratio between the
    lifted dimension and the original dimension and can be dialed in finely. A small calibration
    set drives an intra-block correction step that compensates for the projection error. This
    makes it possible to size a model exactly to a memory budget, for example squeezing a 70B
    model into 2.4 bits so it fits in a 24GB GPU.
  key_idea: >
    Each group of original weights is approximated as the projection of points on a fixed 1-bit
    (binary) lattice that lives in a higher-dimensional lifted space; lifting then projecting
    back yields a structured but non-uniform codebook. Because the effective bit-width equals
    the ratio of the lifted dimension to the original dimension, varying that ratio gives quasi-
    continuous control over the average bits per weight rather than only integer levels.
    Decoding stays cheap since it only requires linear transformations and 1-bit uniform
    quantizers, and an intra-block correction pass over calibration data reduces the
    reconstruction error from projection.
