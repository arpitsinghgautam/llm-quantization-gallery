  typical_degradation: "PixArt-Sigma on MJHQ-30K at W4A4: FID 15.9 / PSNR 19.1 dB, vs SVDQuant FID 18.9 / PSNR 17.6; FLUX.1-dev: 2.1x memory reduction and 2.3x speedup vs BF16 on an RTX 4090"
  tldr: >
    DiRotQ is a post-training scheme for running diffusion transformers (image generators like
    PixArt-Sigma and FLUX) with both weights and activations at 4 bits. The trouble with 4-bit
    activations in these models is that a few directions in the activation space carry most of
    the variance, and crushing them to 4 bits wrecks image quality. DiRotQ uses PCA on
    calibration activations to find that high-variance, low-rank subspace, then rotates each
    layer's activations into the PCA basis so the important directions line up with a handful of
    coordinates. Those coefficients are kept at higher precision while everything else drops to
    4-bit, and weights are quantized with a GPTQ-style pass. Because the rotation is orthogonal
    it leaves the layer's math unchanged, so it folds into the weights with no extra runtime
    cost. The authors also add a vision-language-model-based judge to score perceptual quality
    under aggressive compression, and report 4-bit image quality close to higher-precision
    baselines with measurable memory and latency wins.
  key_idea: >
    For each linear layer Y = XW, DiRotQ computes a calibration-time PCA of the activations X
    and forms an orthogonal rotation R whose leading axes align with the principal (high-
    variance) directions. Activations are rotated as XR and weights pre-rotated as R^T W
    offline; since R R^T = I the layer output is preserved exactly. After rotation the dominant
    variance lives in a small set of leading coordinates, which are assigned higher precision,
    while the remaining (now low-variance) coordinates are quantized to 4 bits per-token.
    Weights are quantized to 4 bits with a GPTQ-style error-compensating pass. This mixed-
    precision-in-the-rotated-basis design targets the heavy-tailed, low-rank activation
    structure specific to diffusion transformers rather than relying on a fixed random Hadamard
    rotation.
