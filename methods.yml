    Each linear weight matrix W is left-multiplied by a Walsh-Hadamard transform (an orthogonal,
    hence loss-invariant, rotation), and its columns are then rescaled by per-coordinate Walsh-
    basis activation energy, a measure of each spectral coordinate's influence on the output.
    This biases the subsequent per-group integer rounding toward high-energy / high-influence
    channels, concentrating quantization error on low-influence directions. The rotated,
    rescaled weights are handed to Intel AutoRound as the reconstruction-error quantizer, and
    the inverse rotation/scale is folded back so the operation is mathematically equivalent to
    the original layer at full precision. Variants include asymmetric constructions and per-pair
    SO(2) rotations that commute with RoPE for attention layers.
