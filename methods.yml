    often a position lands on the decoding frontier with its reliability across masked diffusion
    steps. Stage II performs off-policy, layer-wise calibration that minimizes a hidden-state
    MSE reweighted by this prior, so quantization error is spent preferentially on protecting
    unstable frontier-token decisions rather than already-stable ones. The reweighted objective
    is theoretically motivated as a surrogate for minimizing output KL divergence, and the off-
    policy formulation avoids expensive end-to-end diffusion sampling during calibration. It
    layers on top of FlatQuant-style affine flattening transforms to keep weights and
