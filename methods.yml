    TurboQuant addresses both MSE and inner-product distortion for KV vectors. It randomly
    rotates input vectors - inducing a concentrated Beta distribution on coordinates - then
    applies optimal scalar quantizers per coordinate, exploiting near-independence of
    dimensions in high-dimensional space. For unbiased inner-product estimation, a two-stage
    approach is used: an MSE quantizer followed by a 1-bit Quantized Johnson-Lindenstrauss
    transform on the residual. The method proves information-theoretic lower bounds and shows
    TurboQuant differs from optimal by only a small constant (~2.7x). Integrated with vLLM
