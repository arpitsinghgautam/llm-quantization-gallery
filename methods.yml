  tldr: >
    This is a controlled study of what makes 4-bit floating-point (MXFP4) pretraining of large
    language models go unstable. The authors turn on FP4 one piece at a time across the three
    matrix multiplies in training (forward pass, activation gradients, and weight gradients)
    while holding everything else fixed, and find that quantizing the weight gradient is the
    part that actually breaks convergence; the other two only slightly increase the number of
    tokens needed to reach a given loss. They then test ways to fix the weight-gradient problem
    and find that stochastic rounding and randomized Hadamard rotations do not help once the
    weight gradient is in FP4, but applying a fixed (deterministic) Hadamard rotation before
    quantization brings training back to stable convergence. Their conclusion is that the
    instability comes from structured errors introduced by block-level micro-scaling along
    sensitive gradient paths, not from a lack of randomness. All experiments use native MXFP4 on
    AMD Instinct MI355X GPUs, avoiding software emulation.
  key_idea: >
    Train a transformer with MXFP4 (OCP microscaling FP4: E2M1 elements in 32-element blocks
    sharing an E8M0 scale) progressively enabled in Fprop, Dgrad, and Wgrad to isolate the
    source of divergence. The weight-gradient (Wgrad) GEMM is identified as the dominant driver
    of convergence degradation. Because the instability stems from structured micro-scaling
    quantization error rather than insufficient stochasticity, randomized interventions
    (stochastic rounding, randomized Hadamard) fail, while a deterministic Hadamard rotation
    applied before quantizing the gradient consistently decorrelates and spreads the error to
    restore stable optimization. Native MI355X FP4 hardware is used so the analysis reflects
    real hardware behavior rather than emulation.
