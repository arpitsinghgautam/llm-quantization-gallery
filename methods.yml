  precision: "W4A4"
  granularity: "per-block (NVFP4: 16-element blocks with FP8 block scale)"
  calibration: "distillation fine-tuning against a frozen BF16 teacher (KL output loss + CKA layerwise regularizer)"
  symmetric: "symmetric"
  handles_outliers_via: "CKA-based layerwise Gram-matrix alignment regularizer that preserves internal representational geometry during distillation (complementing NVFP4 block-scale handling of dynamic range)"
  hardware_target: "NVIDIA Blackwell (NVFP4 inference)"
  requires_training: true
  requires_calibration_data: true
  typical_degradation: "Improves layerwise CKA similarity to the BF16 teacher and recovers reasoning/coding accuracy over KL-only QAD on Nemotron 3 Nano and Qwen3-4B-Thinking-2507 (abstract reports qualitative gains; no single numeric ppl/accuracy figure stated)"
  tldr: >
    When you quantize an LLM to NVFP4 and then fine-tune it to copy a full-precision teacher's
    output probabilities (the standard quantization-aware distillation, or QAD, recipe), the
    student can end up producing the right logits while its internal layer activations have
    drifted far from the teacher's. The authors measure this drift with Centered Kernel
    Alignment (CKA) and show it is worst for models that were post-trained with reinforcement
    learning, and that it lines up with weaker reasoning and coding performance. Their fix adds
    a lightweight extra loss term during distillation that pulls each layer's activation
    similarity structure (Gram matrix) back toward the teacher's, so the quantized model matches
    the teacher inside as well as at the output. On Nemotron 3 Nano and Qwen3-4B-Thinking-2507
    this improves internal alignment and downstream accuracy with only modest extra training
    cost.
  key_idea: >
    CKA-QAD augments the usual KL-divergence output-matching loss of NVFP4 quantization-aware
    distillation with a CKA-based representational alignment regularizer. For selected layers,
    it computes the Gram (pairwise-similarity) matrices of the quantized student's and the
    frozen BF16 teacher's activations over a batch and adds a penalty that maximizes their
    Centered Kernel Alignment, encouraging the student to preserve the teacher's internal
    geometry rather than only its final logits. The diagnosis motivating this is that many
    different intermediate activation geometries can yield teacher-aligned outputs, so output
    matching alone can mask internal degradation, which is especially severe in RL-post-trained
    models and correlates with reasoning/coding bottlenecks. The regularizer is cheap to add and
    is presented as a complement to, not a replacement for, output-distribution matching.
  builds_on: ["nvfp4", "bitdistiller"]
  superseded_by: []
  related: ["llm-qat", "bitdistiller", "nvfp4", "fp8-training"]
