  tldr: >
    MixFP4 extends NVFP4 4-bit inference by letting each 16-element block pick the 4-bit number
    format that fits its values best. Instead of forcing every block to use NVFP4's E2M1
    floating-point layout, a block can instead use an E1M2 layout whose representable values are
    evenly spaced like INT4, which suits blocks whose statistics are more uniform. The choice
    for each block is made by comparing quantization error (MSE) between the two layouts during
    quantization, and the single bit recording that choice is tucked into the unused sign bit of
    the FP8 block scale, so no extra storage is needed. At inference both layouts are decoded
    into one shared internal representation, so the same matrix-multiply hardware path works for
    either, and the only cost is a small amount of extra tensor-core logic.
  key_idea: >
    Each block stores its 4-bit payloads in one of two micro-formats: E2M1 (the standard NVFP4
    layout, with non-uniform floating-point spacing for wider dynamic range) or E1M2 (which
    yields uniform, INT4-like level spacing, mapping to a symmetric range under 2x scaling). The
    per-block format is selected by whichever minimizes MSE for that block. The 1-bit format
    selector is packed into the sign bit of the FP8 E4M3 first-level block scale, adding zero
    metadata overhead while reusing NVFP4's existing scale hierarchy. Both micro-formats are
    decoded into a unified internal E2M2 compute representation so the standard block-scaled
    MMA/GEMM execution path is unchanged and the datapath is not duplicated.
