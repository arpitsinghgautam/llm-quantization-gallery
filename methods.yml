  tldr: >
    TORQ is a training-free post-training method for quantizing both the weights and activations
    of an LLM to the MXFP4 microscaling block format (4-bit floating point, e2m1, with each
    block of 32 elements sharing one 8-bit exponent). The authors observe that naively casting
    activations to MXFP4 fails in two ways: some blocks carry far more variance than others, and
    within a block the limited set of FP4 codewords is poorly used. TORQ fixes this with two
    orthogonal rotations applied before quantization. The first rotation rebalances variance
    evenly across blocks, and the second reshapes the distribution inside each block so it
    covers the available codewords more fully. Because the rotations are orthogonal they can be
    folded into the surrounding weight matrices, so inference stays in plain MXFP4 with no extra
    runtime cost while recovering most of the accuracy lost by direct rounding.
  key_idea: >
    TORQ targets two structural imbalances in MXFP4 activation quantization: inter-block
    variance imbalance (high-variance blocks dominate the shared-scale error) and intra-block
    codebook under-utilization. It applies a macro-equilibrium rotation, constructed per token
    position across the blocks using the Schur-Horn theorem, to redistribute variance uniformly
    over the 32-element MXFP4 blocks so no single block's dynamic range dominates its shared
    E8M0 scale. It then applies a micro-alignment rotation inside each block, optimized with a
    codebook-occupancy / maximum-entropy objective, so activation values are spread across the
    e2m1 codeword set rather than clustering. Both transformations are orthogonal, so they
    preserve the matmul exactly and are absorbed into adjacent weights offline, keeping
    inference in standard MXFP4. The procedure is training-free and uses 128 WikiText2
    calibration segments.
