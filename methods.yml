    - "IBM Research"
  paper_url: https://arxiv.org/abs/2604.06515
  code_url: https://github.com/nowazrabbani/moe_quantization
  blog_url: null
  venue: "ICLR 2026"
  precision: "W1/W2/W3 A16 (per-expert mixed, ~2.0-2.75 avg bits/expert)"
  granularity: "per-expert mixed bit-width (per-column bin size within an expert)"
  calibration: "none for bit allocation (router norms only); underlying PTQ (HQQ/GPTQ) may use calibration"
  symmetric: "asymmetric"
  handles_outliers_via: "experts with large max intra-neuron variance promoted to higher precision (ζ=3 threshold)"
  hardware_target: "GPU (single A5000 48GB used for quantized inference)"
  requires_training: false
  requires_calibration_data: false
  typical_degradation: "~2.7 pt avg accuracy drop on Mixtral-8x7B at ~2.75 avg bits/expert (70.01% vs 72.72% FP, 8 zero-shot tasks); beats PMQ at equal bits"
  tldr: >
    This method assigns each expert in a Mixture-of-Experts model its own weight bit-width
    before deployment, rather than quantizing every expert to the same precision. The ranking
    signal is how much an expert's router vector changes (in L2 norm) between the initial and
    fine-tuned model: experts whose routers barely move learn rare-but-important features and
    produce weak activations, so the model's output is most sensitive to quantizing them, and
    they get more bits. Experts whose routers shift a lot can be pushed to very low precision. A
    second pass promotes any expert with unusually large per-neuron weight variance to higher
    precision so it does not inject too much quantization noise. Because the allocation only
    requires sorting router norms, it adds almost no compute, and for pretrained models the
    final router norm can stand in for the change in norm so no fine-tuning is needed.
  key_idea: >
    For each expert s, define the change in router L2 norm Lambda_s = |w_s^(T)| - |w_s^(0)| and
    rank experts in ascending order, with smaller-change experts placed higher (more bits). The
    paper proves on a two-layer MoE classification model that experts learning less-prevalent
    tokens undergo smaller router-norm changes, generate weaker activations, and dominate
    generalization sensitivity, so quantizing them to b_h while dropping others to b_l preserves
    full-precision generalization while saving log2((1-alpha)/alpha) bits per low-precision
    expert. The ordering is then adjusted by max intra-neuron variance MaxVar_s: any lower-
    ranked expert with variance at least zeta=3 times that of a higher-ranked one is promoted,
    fixing rare high-noise experts (about 11/256 on Mixtral). Bits are assigned two-level (top
    kappa fraction to b_h, rest to b_l) or three-level to hit a target average, and the actual
    quantization is performed with an off-the-shelf PTQ backend (HQQ for Switch Transformer,
    GPTQ for Mixtral); non-expert weights stay at 8 bits (Switch) or 3 bits (Mixtral).
  builds_on: ["gptq", "hqq", "moqe"]
  superseded_by: []
  related: ["mc-moe", "awq", "moqe"]
  diagram: assets/diagrams/expert-router-norm-mpq.svg
  diagram_caption: "Router-norm MoE MPQ: rank experts by router L2-norm change (small change -> more bits), reorder high-variance experts up, then assign two/three-level per-expert bit-widths."

