- id: gemq
  name: "GEMQ"
  full_name: "GEMQ: Global Expert-Level Mixed-Precision Quantization for MoE LLMs"
  category: moe
  subcategory: "global-mixed-precision-bit-allocation"
  year: 2026
  date: 2026-05-21
  authors:
    - "Jianing Deng"
    - "Song Wang"
    - "Dongwei Wang"
    - "Zijie Liu"
    - "Tianlong Chen"
    - "Huanrui Yang"
    - "Jingtong Hu"
  affiliation:
    - "University of Pittsburgh"
    - "University of Central Florida"
    - "University of Arizona"
    - "University of North Carolina at Chapel Hill"
  paper_url: https://arxiv.org/abs/2605.23078
  code_url: https://github.com/jndeng/GEMQ
  blog_url: null
  venue: "ICML 2026"
  precision: "W1.5/W2/W2.5/W3 A16 (per-expert mixed, average bits-per-expert budget)"
  granularity: "per-expert mixed bit-widths; group-wise (group size 128) within each expert"
  calibration: "128 WikiText-2 sequences of length 2048 (optionally augmented with MATH/C4 for math tasks)"
  symmetric: "asymmetric"
  handles_outliers_via: "globally important experts receive higher bit-widths via the linear-programming allocation"
  hardware_target: "GPU (NVIDIA H100); custom Triton kernels for real low-bit MoE inference"
  requires_training: true
  requires_calibration_data: true
  typical_degradation: "Mixtral-8x7B at 2.5 bits/expert: WikiText-2 5.03 ppl (FP 3.84), 65.13% avg 7-task 0-shot (FP 70.97, -8.2%); DeepSeekV2-Lite at 2.5 bits/expert: WikiText-2 6.65 ppl (FP 6.31)"
  tldr: >
    GEMQ compresses Mixture-of-Experts LLMs by giving each expert a different bit-width, since
    experts are not equally important and dominate the model's memory. Instead of deciding bit-
    widths layer by layer, it scores every expert across the whole model using a quantization-
    error estimate and then solves a single linear program that picks the bit assignment for all
    experts at once under a target average-bits-per-expert budget. Because quantizing experts
    shifts which experts the router picks, it also lightly fine-tunes the routers so they route
    well to the now-quantized experts. The whole thing runs as a progressive loop that re-
    estimates importance and re-allocates bits as it pushes down to very low budgets like 1.5
    bits per expert, and ships with Triton kernels so the low-bit experts actually run faster
    and use less memory.
  key_idea: >
    GEMQ casts expert bit-width selection as one global integer/linear program over all experts
    in the model: each expert's contribution to output error at each candidate bit-width is
    estimated (using a second-order/quantization-error proxy rather than per-layer activation-
    frequency heuristics), and the LP minimizes total error subject to a global average-bits-
    per-expert budget, capturing model-wide rather than layer-local importance. After
    allocation, each expert is quantized with group-wise asymmetric GPTQ (group size 128). To
    counter the routing distribution shift introduced by quantization, the gating routers are
    fine-tuned with AdamW (lr 1e-4, cross-entropy loss, one epoch) on the calibration set while
    all other weights stay fixed. These steps are wrapped in a progressive framework that steps
    the budget down (e.g. 2.5 to 2.0 to 1.5 bpe), re-estimating importance and re-solving the LP
    at each stage.
  builds_on: ["gptq", "moqe"]
  superseded_by: []
  related: ["moqe", "mc-moe", "gptq", "awq", "spqr"]
  diagram: assets/diagrams/gemq.svg
  diagram_caption: "GEMQ: a global linear program allocates per-expert bit-widths from model-wide quantization-error importance, followed by router fine-tuning, iterated progressively down to ~1.5 bits/expert."

- id: alphaq
  name: "AlphaQ"
  full_name: "AlphaQ: Calibration-Free Bit Allocation for Mixture-of-Experts Quantization"
  category: moe
  subcategory: "calibration-free bit allocation"
  year: 2026
  date: 2026-06-03
  authors:
    - "Wanqi Yang"
    - "Yuexiao Ma"
    - "Alexander Conzelmann"
    - "Xiawu Zheng"
    - "Michael W. Mahoney"
    - "T. Konstantin Rusch"
    - "Shiwei Liu"
  affiliation:
    - "Max Planck Institute for Intelligent Systems"
    - "ELLIS Institute Tübingen"
    - "Tübingen AI Center"
    - "Xiamen University"
    - "International Computer Science Institute / Lawrence Berkeley National Laboratory / UC Berkeley"
    - "Liquid AI"
  paper_url: https://arxiv.org/abs/2606.04980
  code_url: https://github.com/Superone77/AlphaQ
  blog_url: https://www.liquid.ai/research/alphaq-calibration-free-bit-allocation-for-mixture-of-experts-quantization
  venue: null
  precision: "W3.5A16 (per-expert mixed, ~3.5 avg weight bits)"
  granularity: "per-expert bit-width; group-wise weight quantization (group size 128)"
  calibration: "calibration-free bit allocation (HT-SR spectral statistic from weights only); the base per-expert GPTQ quantizer still uses 128 WikiText-2 samples"
  symmetric: "asymmetric"
  handles_outliers_via: "experts with heavier-tailed weight spectra (lower power-law alpha) get higher bit-widths; GPTQ error compensation within each expert"
  hardware_target: "GPU"
  requires_training: false
  requires_calibration_data: false
  typical_degradation: "near-BF16 accuracy at ~3.5 avg bits: Qwen1.5-MoE WikiText-2 PPL 7.38 / 68.04% avg acc; DeepSeek-V2-Lite PPL 6.44 / 70.07%; Mixtral-8x7B PPL 4.23 / 74.29%"
  tldr: >
    AlphaQ decides how many bits each expert in a Mixture-of-Experts model should get, without
    looking at any calibration data to make that decision. For every expert weight matrix it
    computes a single number from the matrix's eigenvalue spectrum that captures how heavy-
    tailed that spectrum is, drawing on Heavy-Tailed Self-Regularization theory: experts whose
    spectra are more heavy-tailed are treated as better-trained and more important, so they keep
    more bits, while experts with lighter tails are pushed to lower precision. These per-expert
    scores feed a budget-constrained optimization that picks the bit assignment minimizing total
    quantization error under a target average bit-width. Each expert is then quantized with
    group-wise asymmetric GPTQ. The result is roughly 3.5 average bits per expert weight with
    accuracy close to the full-precision model and over 4x memory reduction.
  key_idea: >
    Each expert's weight matrix has its empirical spectral density tail fit to a power law
    p(lambda) proportional to lambda^(-alpha), with alpha estimated via the Hill estimator
    (PL_Alpha_Hill). Smaller alpha means a heavier tail, which HT-SR theory associates with a
    better-trained, higher-quality layer that should receive more bits; larger alpha (lighter
    tail) experts can be quantized more aggressively. Given a global average-bit budget, AlphaQ
    solves a budget-constrained allocation that assigns discrete bit-widths to experts to
    minimize total expected quantization error, and then applies group-wise asymmetric GPTQ at
    the chosen bit-width per expert. The allocation itself needs no forward passes or
    calibration data, only the weights, which lets it work when training data is unavailable.
  builds_on: ["gptq", "moqe"]
  superseded_by: []
  related: ["moqe", "mc-moe", "gptq", "squeezellm"]
  diagram: assets/diagrams/alphaq.svg
  diagram_caption: "AlphaQ: per-expert power-law alpha (Hill estimator) on the weight spectrum drives a budget-constrained mixed-precision bit allocation, then GPTQ per expert."


