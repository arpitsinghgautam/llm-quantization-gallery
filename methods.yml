  symmetric: "asymmetric"
  handles_outliers_via: "covariance-aware rotations (eigendecomposition of attention-aware target covariances, composed with Hadamard mixing + bit-reversal permutation) plus offline percentile-based clip thresholds and small BF16 sink/recent-token windows"
  hardware_target: "GPU (fused Triton kernels for rotation/quantization/packing; integrated into SGLang paged attention and vLLM)"
  requires_training: false
  requires_calibration_data: true
  typical_degradation: "3.78-point gap vs BF16 on Qwen3-4B-Thinking-2507 and 1.42-point gap on Qwen3-8B across AIME25, GPQA-Diamond, HumanEval, LiveCodeBench v6, and MATH-500; near-BF16 on Qwen3-32B and GLM-4; effective ~2.28 bits/KV element"
  tldr: >
    OSCAR is a post-training method for compressing the KV cache of large language models down
    to roughly 2 bits per element so that long reasoning traces and 128K-token contexts fit in
    far less memory. The core observation is that what matters is not how well the rotated keys
    and values themselves quantize, but how well attention outputs survive quantization, so the
    rotations are chosen to be aware of the attention computation rather than being generic
    Hadamard transforms. All of the expensive analysis (the rotations and the clipping
    thresholds) is done once offline from a small calibration set, leaving a fixed rotation and
    clip per layer that can be applied cheaply at serving time. At inference, keys and values
    are rotated, clipped, and packed into INT2 with token-wise scales and zero-points, with a
    small number of sink and recent tokens left in BF16. The result keeps accuracy close to BF16
    on reasoning and long-context tasks while cutting KV-cache memory about 8x.
  key_idea: >
    For each layer, OSCAR builds separate rotations for keys and values by eigendecomposing
    attention-aware target covariances (the rotation for keys comes from the query-side
    covariance C_Q = U_Q Lambda_Q U_Q^T so that R_k := U_Q aligns the key subspace with how
    queries actually read it, and the value rotation comes from the softmax/score-weighted
    covariance C_S), then composes these spectral rotations with a Hadamard mixing matrix and a
    bit-reversal permutation to spread remaining energy evenly across channels. Offline
    calibration also fits per-layer percentile-based clip thresholds (typical c_K ~ 0.96, c_V ~
    0.92) to bound outliers before rounding. At serving time the rotated, clipped K/V are
    quantized with token-wise affine asymmetric INT2 (scale + zero-point, block size 128
    metadata), keeping sink and recent tokens in BF16, giving about 2.28 effective bits per KV
    element. Fused Triton kernels perform rotation, quantization, and packing inside SGLang's
    paged attention, yielding up to ~7x throughput at large batch sizes and up to ~3x batch-1
    decode speedup.
