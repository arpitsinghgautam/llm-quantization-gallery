  typical_degradation: "On LLaMA-3.2-1B at W4A4, selected-layer error improves up to 18.5% over the SmoothRot baseline (12% from joint alpha,q search; 11.1% from quantile-only policy search); replaying the best policy on all decoder-block down-projection layers cuts full-layer mean error from 97.51 to 78.08 (19.9%). No perplexity/accuracy numbers reported."
  tldr: >
    This is a post-training method for W4A4 LLM quantization that refines the SmoothRot
    pipeline, which combines SmoothQuant-style scale migration with a rotation transform to tame
    activation outliers. The authors argue that fixed, max-based scaling pushes too much outlier
    energy from activations into weights (over-migration), so they replace the max statistic
    with a high quantile to set scales more robustly and then fine-tune the per-channel scales
    with a small constrained gradient search. Both the smoothing strength and the quantile are
    treated as searchable knobs, and a lightweight training step adjusts the channel scales
    while keeping the model weights frozen and the transform mathematically equivalent. On
    LLaMA-3.2-1B they report consistent per-layer error reductions over the SmoothRot baseline,
    with the largest gains on down-projection layers.
  key_idea: >
    SmoothRot-style equivalent transforms factor a linear layer's computation as X W = (X
    diag(s)^-1 R^-1)(R diag(s) W), where diag(s) migrates per-channel outlier magnitude from
    activations into weights and R is a rotation that further spreads outlier energy. The paper
    replaces the usual max-based rule for s with a high-quantile statistic so a few extreme
    samples do not inflate the scale and cause over-migration, and it jointly searches the
    smoothing exponent alpha together with the quantile level q. It then adds a constrained
    gradient-based optimization that learns the per-channel scales directly to minimize layer-
    wise reconstruction error under W4A4, while the transform remains an exact equivalence so no
    model weights are modified.
