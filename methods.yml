    For all transformer blocks except the last, LFQ keeps the usual per-block MSE reconstruction
    used by the chosen base method (FlexRound, OmniQuant, or Block-AP). For the final block it
    switches the objective: the quantized final block and the (also quantized) LM head are
    jointly optimized by minimizing the cross-entropy / KL divergence between the full-precision
    and quantized output token probability distributions over calibration sequences. This pulls
    the unembedding layer into the optimization, which block-wise PTQ normally omits, and aligns
    the soft output distribution rather than intermediate activations, which matters most for
    autoregressive generation where small per-token probability errors compound over long
    outputs.
