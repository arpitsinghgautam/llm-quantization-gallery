  paper_url: https://arxiv.org/abs/2604.11080
  code_url: null
  blog_url: null
  venue: "ICML 2026"
  precision: "W4A4KV4 / W3A3KV3"
  granularity: "per-channel weights (symmetric, with GPTQ); per-token activations and KV cache (asymmetric)"
  calibration: "WikiText-2 (800 random segments); C4 also tested; ~100 optimization steps for the rotation matrices"
  symmetric: "mixed (weights symmetric; activations and KV asymmetric)"
  handles_outliers_via: "layer-wise learned orthogonal rotations fused offline into weights, with residual basis mismatch across the skip connection corrected by a low-rank subspace rotation approximation"
  hardware_target: "GPU (NVIDIA H100); no custom 4-bit kernels (PyTorch + HuggingFace)"
  requires_training: false
  requires_calibration_data: true
  typical_degradation: "LLaMA-3 8B W4A4: 7.24 WikiText-2 ppl (vs 7.50 for SpinQuant); LLaMA-2 7B W4A4: 5.74 ppl. At W3A3, LLaMA-3 8B: 13.09 ppl (vs 15.07 SpinQuant); LLaMA-3.2 1B: 49.90 ppl (vs 69.70 SpinQuant)"
  tldr: >
    ReSpinQuant targets the gap between two families of rotation-based quantization. Global-
    rotation methods use a single learned rotation that can be folded into the weights for free
    at inference, but one rotation for the whole network limits how well it can suppress
    outliers. Per-layer rotation methods are more accurate but cannot be folded into weights
    because the residual (skip) connection forces every layer to share a common basis, so they
    pay an online matrix-multiply cost at runtime. ReSpinQuant lets each layer learn its own
    rotation and still fuse it into the weights; the only thing it computes online is a small
    correction for the mismatch between a layer's incoming and outgoing bases. That correction
    is done inside a tiny rank-r subspace (default r=32) rather than over the full hidden
    dimension, so the runtime overhead is about 1.7 percent while accuracy stays close to the
    expensive per-layer baselines, even down to 3-bit weights and activations.
  key_idea: >
    Each transformer block learns its own orthogonal rotation R that is fused offline into the
    adjacent weight matrices (attention and FFN). Because the residual stream couples
    consecutive blocks, the input rotation R_in of one block and the output rotation R_out of
    the previous block differ, producing a basis-mismatch transition matrix T = R_out * R_in^T
    that would normally have to be applied densely (O(D^2)) at inference. ReSpinQuant takes an
    SVD of (T - I), keeps the top-r principal directions, and applies a learned r x r rotation
    only within that subspace while leaving the orthogonal complement unchanged, reducing the
    online cost to O(D*r). Weights are quantized with GPTQ (symmetric, per-channel); activations
    and the KV cache are quantized asymmetrically to the same bit-width. Rotations are optimized
    on a small calibration set with a Cayley (Stiefel-manifold) optimizer, so no model weights
    are trained.
  builds_on: ["spinquant", "quarot", "flatquant", "gptq"]
  superseded_by: []
  related: ["spinquant", "quarot", "flatquant", "duquant", "resq", "paroquant"]
  diagram: assets/diagrams/respinquant.svg
  diagram_caption: "Per-layer rotations fused into weights; residual basis mismatch corrected by a low-rank (rank-r) subspace rotation applied online."

