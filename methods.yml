  calibration: "1,024 RedPajama samples for LDLQ Hessian-based PTQ initialization; QAT fine-tuning on ~4B FineWeb tokens (only 0.1%-10% of data used by prior QAT)"
  symmetric: "symmetric"
  handles_outliers_via: "Hadamard (incoherence) transform on weights during PTQ initialization, following QuIP#/QTIP"
  hardware_target: "GPU (NVIDIA A100; custom fused CUDA kernel, ~1.68x speedup over FP16 on LLaMA-3-8B)"
  requires_training: true
  requires_calibration_data: true
  typical_degradation: "2-bit LLaMA-3-8B: WikiText-2 PPL 9.38, average zero-shot ~73.4 (ARC-C 57.9, ARC-E 83.0); reported to beat prior SOTA QAT using 0.1%-10% of the training data"
  tldr: >
    LC-QAT is a way to train large language models down to 2 bits per weight while using only a
    small slice of the data that earlier quantization-aware training needed. Standard QAT rounds
    each weight to a scalar value, which falls apart badly at 2 bits; vector quantization
    (grouping several weights and mapping them to entries in a codebook) holds up much better
    but normally can't be trained end-to-end because looking up a codebook entry is not
    differentiable. LC-QAT sidesteps this by writing each quantized vector as a learned linear
    (affine) function of a small set of discrete integer codes, so the forward pass is a plain
    matrix expression that gradients flow through, with no explicit lookup step during training.
    It first builds a strong starting point with a post-training pass (Hadamard incoherence
    processing plus an LDLQ-style Hessian-guided quantization), and because that initialization
    is already good, only a short fine-tune on a fraction of the usual data is needed to recover
    quality.
  key_idea: >
    Each group of d weights is quantized to a vector c parameterized as an affine map c = A z +
    B over discrete integer codes z in {0,1,2,3}^d (a linear-constrained reparameterization of
    vector quantization extending UniSVQ). This replaces the non-differentiable codebook lookup
    with a closed-form linear expression, letting the whole network train end-to-end with
    ordinary gradients while still enjoying vector quantization's higher representational
    capacity at 2 bits. Initialization comes from a PTQ stage: weights are first made incoherent
    via a Hadamard transform (following QuIP#/QTIP), then quantized with an LDLQ Hessian-aware
    procedure using ~1,024 calibration samples, producing a high-quality starting point so that
    subsequent QAT needs only 0.1%-10% of the data prior methods use. A custom fused CUDA kernel
    implements the reformulated forward pass for fast inference.
  builds_on: ["qtip", "llm-qat"]
  superseded_by: []
  related: ["aqlm", "qtip", "efficientqat", "pv-tuning"]
