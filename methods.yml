- id: slq
  name: "SLQ"
  full_name: "Statistically-Lossless Quantization of Large Language Models"
  category: ptq_weight_only
  subcategory: "mixed-precision bit allocation"
  year: 2026
  date: 2026-05-04
  authors:
    - "Michael Helcig"
    - "Eldar Kurtic"
    - "Dan Alistarh"
  affiliation:
    - "IST Austria"
    - "Red Hat AI"
  paper_url: https://arxiv.org/abs/2605.02404
  code_url: https://github.com/IST-DASLab/SLQ
  blog_url: null
  venue: null
  precision: "W3.3-W6.6 A16 (per-layer mixed; ~3.3-4.7 bits task-lossless, ~5-6.6 bits distribution-lossless)"
  granularity: "group-wise (group size 128), per-layer bitwidth from {2,3,4,5,6,7,8}"
  calibration: "512 calibration samples; no gradient updates"
  symmetric: "asymmetric"
  handles_outliers_via: "asymmetric (zero-point) quantization plus GPTQ-style second-order error compensation; higher per-layer bitwidths allocated to sensitive layers"
  hardware_target: "NVIDIA GPU (L40S); vLLM with Marlin-based mixed-bitwidth kernels for 4-8 bit weight-only inference"
  requires_training: false
  requires_calibration_data: true
  typical_degradation: "task-lossless at ~3.3 bits (e.g. Qwen3.5-27B at 3.30 bits, ~0.991 avg accuracy recovery vs FP16 across ARC-Challenge, GSM8K, GSM8K-CoT, IFEval, MMLU-CoT, MMLU-Pro); also evaluated on Qwen3-8B, Qwen3-32B, Llama-3.3-70B-Instruct"
  tldr: >
    SLQ reframes LLM weight quantization around three concrete definitions of "lossless": task-
    lossless (zero-shot benchmark accuracy stays within natural sampling noise of the FP16
    model), distribution-lossless (the quantized model's next-token distribution is practically
    interchangeable with the original), and a theoretical argument that asymmetric integer
    quantization injects less error than symmetric. To hit a chosen losslessness target at the
    fewest bits, it scores how much each layer is hurt by each candidate bitwidth and then
    solves an integer program that hands out bits per layer, so easy layers go low and sensitive
    ones stay high. The result is post-training, calibration-only (no fine-tuning), and reaches
    roughly 3.3 bits per parameter while preserving benchmark accuracy, with measured 1.7-3.6x
    throughput gains over FP16 using optimized mixed-bitwidth kernels.
  key_idea: >
    SLQ performs weight-only post-training quantization with group-wise (g=128) asymmetric
    integer quantization and assigns a separate bitwidth to each layer drawn from
    {2,3,4,5,6,7,8}. Per-layer sensitivity is estimated with a multi-bitwidth Shapley-style
    attribution over calibration data, and an integer linear program then allocates bits across
    layers to minimize predicted degradation under a fidelity constraint. Two fidelity targets
    are defined: task-lossless (accuracy within sampling variance) and distribution-lossless,
    the latter measured by Expected Acceptance Rate (EAR), the average of sum_k min(p(k), q(k))
    between original and quantized token distributions, which equals the maximum token-agreement
    probability under optimal coupling. A gamma-squared variance law motivates using asymmetric
    over symmetric quantization to reduce noise variance.
  builds_on: ["gptq", "owq", "spqr"]
  superseded_by: []
  related: ["awq", "squeezellm", "marlin", "autoround"]
  diagram: assets/diagrams/slq.svg
  diagram_caption: "SLQ: per-layer Shapley sensitivity scoring feeds an ILP that allocates bitwidths {2..8} to meet a task- or distribution-lossless target under group-wise asymmetric quantization."

- id: osaq
  name: "OSAQ"
  full_name: "OSAQ: Outlier Self-Absorption for Accurate Low-bit LLM Quantization"
  category: ptq_weight_only
  subcategory: "outlier suppression via Hessian null space"
  year: 2026
  date: 2026-05-06
  authors:
    - "Zhikai Li"
    - "Zhen Dong"
    - "Xuewen Liu"
    - "Jing Zhang"
    - "Qingyi Gu"
  affiliation:
    - "Institute of Automation, Chinese Academy of Sciences"
  paper_url: https://arxiv.org/abs/2605.04738
  code_url: null
  blog_url: null
  venue: "ICML 2026"
  precision: "W2/W3/W4 A16"
  granularity: "per-channel and per-group (group size 128)"
  calibration: "128 sequences x 2048 tokens, unlabeled (to estimate the Hessian)"
  symmetric: "asymmetric"
  handles_outliers_via: "additive weight transform built from the stable null space of the layer Hessian; outliers are absorbed into directions of vanishing curvature so task loss is unchanged"
  hardware_target: "GPU; absorbed into weights offline so existing W4A16/W2A16 inference kernels apply with no added overhead"
  requires_training: false
  requires_calibration_data: true
  typical_degradation: "LLaMA2-13B W2A16 g128: WikiText-2 perplexity 28.1 (GPTQ) -> 13.4 (OSAQ+GPTQ), over 40% lower; tested up to LLaMA-3.1-405B"
  tldr: >
    OSAQ is a preprocessing step for weight-only LLM quantization that reshapes a layer's
    weights so they are easier to round to very low bit-widths. The authors notice that the
    layer's Hessian (which measures how much each weight direction affects the loss) is
    consistently low-rank across different inputs, meaning some directions barely matter. They
    build an additive correction out of those flat directions and add it to the weights to
    flatten out large outlier values, which leaves the layer's output essentially unchanged.
    Because the correction is computed in closed form and folded directly into the weights ahead
    of time, it adds no training cost and no inference cost, and it can be stacked in front of
    an existing quantizer like GPTQ.
  key_idea: >
    OSAQ observes that the layer-wise Hessian H exhibits low-rank consistency across calibration
    inputs, so a stable set of directions have vanishing curvature (the Hessian null space). It
    constructs an additive weight transform W' = W + delta, where delta is a linear combination
    of vectors spanning this null space, chosen to minimize the magnitude of weight outliers.
    Because delta lies in the null space, the change to the task loss is (to second order) zero,
    so accuracy is preserved while the weight distribution becomes flatter and easier to
    quantize. The optimal coefficients are obtained by a closed-form least-squares solution, and
    delta is absorbed into the weights offline, requiring no inter-layer transforms (unlike
    rotation methods) and adding no inference overhead; it is applied as a front-end to standard
    quantizers such as GPTQ.
  builds_on: ["gptq"]
  superseded_by: []
  related: ["quip", "quarot", "spinquant", "duquant", "owq", "spqr"]
  diagram: assets/diagrams/osaq.svg
  diagram_caption: "OSAQ estimates the layer Hessian from calibration data, extracts its stable null space (directions of vanishing curvature), and adds a closed-form null-space combination to the weights to suppress outliers without changing the layer output; the transformed weights are then quantized (e.g. with GPTQ) at 2-4 bits with no inference overhead."

- id: admm-q
  name: "ADMM-Q"
  full_name: "ADMM-Q: An Improved Hessian-based Weight Quantizer for Post-Training Quantization of Large Language Models"
  category: ptq_weight_only
  subcategory: "second-order"
  year: 2026
  date: 2026-05-11
  authors:
    - "Ryan Lucas"
    - "Mehdi Makni"
    - "Xiang Meng"
    - "Adam Deng"
    - "Rahul Mazumder"
  affiliation:
    - "MIT Operations Research Center"
    - "MIT Sloan School of Management"
  paper_url: https://arxiv.org/abs/2605.11222
  code_url: null
  blog_url: null
  venue: null
  precision: "W2A16/W3A16/W4A16 (also composes to W4A8, W2A4KV4, W4A4KV4)"
  granularity: "per-channel or per-group, group size 128 tested"
  calibration: "layer-wise Hessian from calibration-sample input activations (unlabeled)"
  symmetric: "mixed"
  handles_outliers_via: "MSE grid-search range clipping (100 grid points, max shrink 0.8); composable with SmoothQuant per-channel scaling and SpinQuant rotations"
  hardware_target: "GPU; drop-in weight quantizer for existing W4A16/W4A8/W4A4 inference pipelines"
  requires_training: false
  requires_calibration_data: true
  typical_degradation: "Qwen3-8B WikiText-2 ppl vs GPTQ: W3A16 10.06 vs 12.85; W4A8 (SmoothQuant) 8.68 vs 9.29; W2A4KV4 (SpinQuant) 19.42 vs 66.11. LLaMA-3-8B W4A4KV4 (SpinQuant) 7.26 vs GPTQ 7.34"
  tldr: >
    ADMM-Q replaces GPTQ's greedy column-by-column rounding with an operator-splitting solver
    that adjusts every weight in a layer at once to keep the layer's output close to the
    original. It alternates between a continuous update that lowers reconstruction error and a
    step that nudges weights toward the nearest allowed quantized values, gradually tightening
    the quantization constraint until the weights actually land on the grid. Extra tricks (a
    penalty schedule, preconditioning, and a final local-search pass that flips individual
    weights) make it run efficiently and converge reliably. Because it only changes how the
    weights are picked, it slots into existing pipelines and stacks with clipping, rotations,
    and activation scaling, with the biggest gains showing up at aggressive sub-4-bit settings.
  key_idea: >
    ADMM-Q formulates layer-wise weight quantization as a constrained least-squares problem
    minimizing the Hessian-weighted reconstruction error ||W - Ŵ||_H subject to Ŵ lying on the
    quantization grid, then solves it with a combinatorial variant of the Alternating Direction
    Method of Multipliers. It splits the problem into a continuous primal variable and a
    discrete (quantized) copy linked by a dual variable: one block solves a Hessian-regularized
    continuous update, the other projects onto the discrete codebook, and the dual penalty is
    annealed on a schedule so the continuous solution is steadily pulled onto the grid with
    convergence guarantees. Preconditioning accelerates the continuous solves and a local-search
    post-processing step greedily flips individual quantized weights to escape poor local
    minima. Unlike GPTQ's one-pass greedy error feedback, all weights in the layer are optimized
    jointly and iteratively.
  builds_on: ["gptq", "obs"]
  superseded_by: []
  related: ["spqr", "quip", "smoothquant", "spinquant", "quarot", "awq"]
  diagram: assets/diagrams/admm-q.svg
  diagram_caption: "ADMM operator splitting: alternate continuous Hessian-weighted updates with projection onto the quantization grid, annealing the dual penalty until weights land on the grid."

- id: xfp
  name: "XFP"
  full_name: "XFP: Quality-Targeted Adaptive Codebook Quantization with Sparse Outlier Separation for LLM Inference"
  category: ptq_weight_only
  subcategory: "codebook / vector quantization"
  year: 2026
  date: 2026-05-14
  authors:
    - "Thomas Witt"
  affiliation: []
  paper_url: https://arxiv.org/abs/2605.14844
  code_url: https://github.com/flash7777/vllm/tree/multiquant
  blog_url: null
  venue: null
  precision: "W3-W4 (~3.4 effective bits) A16"
  granularity: "per-channel learned codebooks (V2) or 32 shared codebooks per layer (V2a); per-group indices"
  calibration: "none - no Hessian and no calibration data; quality floors drive an iterative search"
  symmetric: "asymmetric"
  handles_outliers_via: "sparse fp16 outlier residual separated from the dense codebook-indexed bulk, with an auto-determined per-layer outlier budget"
  hardware_target: "NVIDIA GPU (RTX PRO 6000 Blackwell workstation); unified decode kernel in a vLLM branch"
  requires_training: false
  requires_calibration_data: false
  typical_degradation: "94.49% GSM8K strict-match on Qwen3.5-122B-A10B (V2, INT4-equivalent); 66.72% GSM8K on Qwen3.5-397B-A17B at ~3.4 effective bits"
  tldr: >
    XFP is a weight-only quantizer that flips the usual setup: instead of picking a bit-width,
    the operator sets a target reconstruction-quality floor expressed as per-channel cosine
    similarity, and the method itself decides how big each layer's codebook should be, how many
    outliers to keep in full precision, and how to pack the result. Each weight matrix is split
    into a sparse fp16 residual that holds the largest outliers and a dense tensor of sub-byte
    indices into a per-group codebook learned by Lloyd iteration on the remaining bulk weights.
    Because no Hessian or calibration data is used, quantization runs without any forward passes
    over sample text. It is built mainly for Mixture-of-Experts models, using a stricter quality
    floor for attention and shared experts and a looser one for routed experts, and an outer
    loop adjusts those two thresholds until a model just fits a given memory budget while still
    producing usable output.
  key_idea: >
    XFP decomposes each weight matrix into a sparse fp16 outlier residual plus a dense sub-byte
    index tensor that points into a learned per-group codebook. Codebook centroids are fit with
    about 20 rounds of Lloyd assignment-and-update on the outlier-cleaned bulk distribution,
    offered in a per-channel mode (V2) and a mode that shares a library of 32 codebooks per
    layer (V2a) behind a common decode kernel. The user specifies two per-channel cosine-
    similarity floors (strict for attention/shared experts, lazy for routed MoE experts) and the
    system automatically selects codebook size, outlier budget, and packing per layer to meet
    them. An outer H-Process iterates over the two thresholds to find the operating point where
    a model just fits the available hardware memory while still producing sensible output.
  builds_on: ["squeezellm", "spqr", "aqlm"]
  superseded_by: []
  related: ["squeezellm", "spqr", "aqlm", "marlin", "vllm-quant"]
