  tldr: >
    FibQuant compresses the key-value cache used during long-context inference, where the cache
    grows with context, batch, layers, and heads and is re-read at every decoding step. It keeps
    the same lightweight pipeline used by rotation-based scalar codecs (store a per-block norm,
    apply a shared random rotation, then encode) but observes that after the rotation a block of
    consecutive coordinates is not independent values; it is a point on a sphere following a
    spherical-Beta distribution. Instead of quantizing one coordinate at a time with scalar
    tables, FibQuant uses a single shared codebook over that spherical geometry, picking radii
    from Beta quantiles and directions from quasi-uniform Fibonacci/Roberts-Kronecker lattices,
    then refining with Lloyd-Max. Because every token maps to a fixed-size, fixed-address code,
    the cache stays randomly accessible and the method needs no calibration data, while
    supporting a continuous range of bit-rates including fractional and sub-one-bit settings.
  key_idea: >
    After normalizing a KV block and applying a shared Haar rotation, the k consecutive
    coordinates form a spherical-Beta source on the unit ball rather than a product of
    independent scalars. FibQuant replaces the scalar quantization tables of rotation-based
    codecs with one shared radial-angular vector codebook matched to this canonical source:
    Beta-quantile radii set the magnitude levels, Fibonacci/Roberts-Kronecker quasi-uniform
    lattice points set the directions on the sphere, and multi-restart Lloyd-Max refines the
    cells. The construction is proven to strictly improve on its scalar product specialization
    at matched rate, with the high-rate gain decomposing into a cell-shaping factor and a
    density-matching factor. The fixed-rate design yields fixed-address per-token codes
    (preserving random access) and a dense rate axis down to sub-one-bit without calibration or
    variable-length addressing.
