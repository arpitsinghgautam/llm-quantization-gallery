  tldr: >
    LBLLM compresses LLM weights to roughly two effective bits (one binary weight matrix plus a
    one-bit per-group bitmap) while keeping activations at 4 bits, and reaches usable accuracy
    after fine-tuning on only 0.016B tokens on a single GPU. Rather than learning weights and
    activations at the same time, it runs three separate phases: a post-training quantization
    warm start, then layer-wise distillation that fits the binary weights and per-group
    parameters with activations left in full precision, and finally a short phase that learns
    the activation quantizers. Splitting the work this way keeps training stable and avoids the
    two quantization steps fighting each other. The result improves on prior binarization
    methods in the comparable two-bit-weight, four-bit-activation regime across language
    modeling, commonsense QA, and language understanding.
  key_idea: >
    Each linear layer stores a binary weight matrix together with a binary group-assignment
    bitmap; the bitmap routes every weight to one of two groups, each with its own learned scale
    and offset, so two binary signals together encode four states (about two bits) at group size
    128. Training proceeds in three decoupled stages: (1) a PTQ initialization for a good
    starting point, (2) layer-wise knowledge distillation that learns the binary weights, group
    bitmaps, and quantization parameters while activations stay full-precision, and (3) learning
    dynamic 4-bit activation quantizers using learnable clipping factors and learnable knee
    points that partition the activation range into three regions. Decoupling weight and
    activation quantization reduces interference and yields more stable optimization than joint
    training.
  builds_on: ["billm", "onebit", "pb-llm"]
