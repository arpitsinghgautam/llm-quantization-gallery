  tldr: >
    ScaleSweep is a post-training method for quantizing LLMs into NVFP4, NVIDIA's FP4 format
    that pairs every block of 16 values with an FP8 scale. Instead of setting each block's scale
    to the block's maximum absolute value (AbsMax), which is what current NVFP4 pipelines do,
    ScaleSweep tries a range of candidate scales for each block and keeps the one that minimizes
    the reconstruction error against the original block. To keep this cheap, the authors derive
    lower and upper bounds on where the best scale can possibly lie under mean-squared-error and
    weighted-mean-squared-error objectives, so only a small set of candidates needs to be
    checked. The result is a near-drop-in replacement for the quantization operator that adds
    little overhead and works when weights, activations, KV cache, and query states are all
    pushed to 4-bit.
  key_idea: >
    For each NVFP4 block, the per-block FP8 scale determines how the 16 values are mapped onto
    the E2M1 grid; AbsMax fixes this scale at the block max, which is generally not the error-
    minimizing choice. ScaleSweep instead treats the scale as a free parameter and sweeps over
    feasible candidates, selecting the one that minimizes MSE or WMSE between the original block
    and its quantized-then-dequantized reconstruction. A theoretical analysis of NVFP4
    quantization yields provable lower and upper bounds on the optimal scale, which shrink the
    candidate set enough that the sweep cost is negligible relative to the baseline quantization
    operator while still containing the optimum. The scheme is applied end-to-end across
    weights, activations, KV cache, and query states.
  builds_on: ["nvfp4"]
