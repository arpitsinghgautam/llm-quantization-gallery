  tldr: >
    This method treats KV-cache precision as a per-token budgeting problem rather than picking
    one fixed bit-width for everything. During decoding, a small learned controller looks at
    four cheap signals for the current token (entropy of the next-token distribution, a token-
    rarity score from training frequency, how spread-out the final-layer attention is, and the
    model's confidence) and decides whether that token's keys and values should be stored at 2,
    4, 8, or 16 bits. The idea borrows the Huffman-coding intuition that frequent or low-
    importance items deserve fewer bits, so most tokens are stored cheaply while the few that
    matter keep high precision. On small SmolLM models this keeps accuracy almost identical to
    FP16 while lowering both memory traffic and per-token latency relative to static fixed-bit
    KV quantization.
  key_idea: >
    A three-layer MLP controller (two hidden layers of width 128, ReLU, softmax over precision
    classes) maps a 4-dimensional per-token feature vector -- next-token entropy, smoothed self-
    information / rarity, final-layer attention variance, and prediction confidence -- to one of
    four precision levels {2-bit, 4-bit, 8-bit, FP16}. The selected level is applied with
    uniform symmetric per-token quantization to that token's K and V entries as they are written
    to the cache. By spending bits proportional to estimated token importance, the scheme
    minimizes expected KV-cache memory and bandwidth while keeping salient tokens near full
    precision, trading a tiny accuracy loss for lower decoding latency.
