  tldr: >
    Bit-by-Bit is a training recipe for pushing LLMs down to 2-bit weights and 2-bit activations
    while keeping training stable. Instead of quantizing straight to the target bit-width, it
    lowers precision in stages block by block so the model adapts gradually rather than
    collapsing under quantization noise. It also lays the integer quantization grids out so that
    coarser grids are nested inside finer ones, which lets a single trained model be served at
    several different bit-widths without retraining. To deal with the heavy-tailed channels that
    cause most of the error, it duplicates the worst channels and rebalances them in a way that
    leaves the layer's output unchanged before quantization. The authors also wrote custom W2A2
    and W2A16 GPU kernels so the low-bit model actually runs faster at inference.
  key_idea: >
    Three components combine into one QAT pipeline. (1) Block-wise progressive training:
    precision is reduced stage by stage rather than jumping to the target low bit-width,
    limiting convergence instability and cross-layer error accumulation. (2) Nested integer
    quantization grids: lower-precision grids are subsets of higher-precision ones, enabling a
    train-once / deploy-at-any-precision model with asymmetric (zero-point) quantizers and E4M3
    micro-scaling group scales at group size 32. (3) Rounding-aware outlier channel splitting:
    outlier channels (ranked by ||X_i||_2 * max|W_ij|) are split into two channels that reduce
    the per-channel quantization range while acting as an exact identity transform, so the pre-
    quantization output is unchanged.
  builds_on: ["efficientqat", "bitdistiller", "llm-qat", "mx-formats"]
  superseded_by: []
