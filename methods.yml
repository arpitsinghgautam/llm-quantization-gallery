  year: 2024
  date: 2024-02-15
  authors: ["Yuzhuang Xu", "Xu Han", "Zonghan Yang", "Shuo Wang", "Qingfu Zhu", "Zhiyuan Liu", "Weidong Liu", "Wanxiang Che"]
  affiliation: ["Tsinghua University", "Harbin Institute of Technology"]
  paper_url: https://arxiv.org/abs/2402.11295
  code_url: null
  blog_url: null
