    modality (vision channels by maximum absolute activation, text channels by percentile rank
    within each token plus within-cluster variance) and partitions channels into three disjoint
    sets: modality-compatible, text-specific, and vision-specific, so each modality's outliers
    are isolated cheaply. Adaptive Cross-Modal Calibration (ACC) then adds dual lightweight
    learnable low-rank branches (a FlatQuant-style learnable affine parameterization, with
    separate matrices Us/Vs for shared and Uc/Vc for modality channels) that dynamically
    compensate for modality-induced quantization error. Together they let weights and
    activations be quantized to W4A8 down to W3A2 while preserving most of FP16 accuracy on VLM
