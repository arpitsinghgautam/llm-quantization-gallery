  code_url: https://github.com/glassescrab/mlir-aie/tree/feature/update-mix-mm-int4-verification
  blog_url: null
  venue: null
  precision: "W4A16, W8A16"
  granularity: "W4A16 asymmetric per-group (g=128); W8A16 symmetric per-channel; dequantized to BF16"
  calibration: "n/a (inference kernel library; consumes pre-quantized off-the-shelf models)"
  symmetric: "mixed"
  handles_outliers_via: "n/a (kernel/runtime; relies on the upstream AWQ-style quantization for accuracy)"
  hardware_target: "AMD XDNA2 NPUs in Ryzen AI SoCs (Ryzen AI 7 350 Krackan Point, Ryzen AI 9 HX 370 Strix Point); uses the IRON/MLIR-AIE programming stack and the 4x8 AIE array"
  requires_training: false
  requires_calibration_data: false
  typical_degradation: "n/a - kernel/runtime, not a quantization algorithm; no accuracy change reported. Performance: up to 2.0x lower prefill latency and >64.6% lower energy vs the iGPU baseline; up to 121.6% (GEMM) and 281% (GEMV) kernel throughput gains over full-precision on AMD NPU, evaluated on Llama3-8B, Gemma-2B, and Qwen2.5-3B."
  tldr: >
    TileFuse is a kernel library that lets already-quantized LLMs (in common AWQ-style W4A16 and
    W8A16 formats from Hugging Face) run efficiently on AMD's XDNA2 NPUs found in Ryzen AI
    laptop chips. Instead of unpacking the low-bit weights, dequantizing them, and then doing
    the matrix multiply as separate passes that bounce data through memory, TileFuse merges all
    three steps into a single on-chip kernel so the spatial AIE array stays busy. It also lays
    out the weight tiles ahead of time in an interleaved column-major order and packs the scales
    and zero-points alongside them, and it redesigns the GEMV dataflow to use the full 4x8 array
    for the memory-bound decode phase. The result is faster, lower-energy on-device inference
    without changing the quantized model itself.
  key_idea: >
    TileFuse fuses weight unpacking (bit-mask/shift to extract 4-bit fields), dequantization
    (integer-to-BF16 using per-group/per-channel scale and zero-point metadata), and the
    GEMM/GEMV matmul into one microkernel pipeline running on the XDNA2 spatial array, keeping
    dequantized weights in compute-core buffers for reuse. Weights are pre-tiled offline in an
    interleaved column-major layout (supporting dimensions up to 32K) with scales and zero-
    points pre-packed alongside the tiles, minimizing on-device data movement. A redesigned GEMV
    dataflow maps the memory-bound decode phase across the full 4x8 AIE array to maximize
    utilization. It targets standard AWQ-format models via AMD's open IRON/MLIR-AIE stack rather
    than requiring a proprietary NPU quantization scheme.
  builds_on: ["awq", "marlin"]
  superseded_by: []
  related: ["awq", "marlin", "fp6-llm", "qserve"]
