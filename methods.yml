  typical_degradation: "WikiText-2 PPL: LLaMA3-8B W4A8 10.2 vs FP16 8.6; Qwen3-8B W4A8 10.6 vs FP16 9.7 (W4A4 11.2); Qwen3-8B 6-task zero-shot avg 70.6 vs FP16 71.6; up to 1.24x speedup over W16A16"
  tldr: >
    MosaicQuant is a post-training method that pushes both weights and activations to 4 bits
    without keeping any values in higher precision. Instead of the usual trick of storing rare
    large-magnitude outlier weights in a separate high-precision format, it first quantizes the
    entire weight matrix to a single dense 4-bit representation, accepting that outliers get
    crushed. It then measures which weight blocks hurt the layer output most, using a diagonal-
    Hessian-based score, and adds a second sparse 4-bit residual only on those blocks to claw
    back the lost accuracy. Because both the base and the correction are 4-bit, the whole
    computation stays in one uniform low-bit pipeline; a fused kernel called ZipperEngine folds
    the sparse residual into the dense 4-bit matrix multiply so there is no extra precision
    conversion or memory traffic. It needs only a small calibration set and keeps accuracy close
    to FP16 on LLaMA3 and Qwen3 while running faster than the FP16 baseline.
  key_idea: >
    MosaicQuant disaggregates inliers and outliers entirely within 4-bit precision: a dense
    4-bit base captures inliers faithfully while outliers are quantized away, and a sparse 4-bit
    residual then compensates the resulting error only on the most error-critical weight blocks.
    Those blocks are picked by a Hessian-guided, output-aware criterion: for each input channel
    the diagonal Hessian estimate weights how strongly that channel's quantization error
    distorts the layer output, concentrating the residual budget where it matters. To keep
    execution uniform, ZipperEngine fuses the sparse residual blocks into the dense INT4 GEMM
    through an overlapped pipeline that interleaves dequant, compute, and reduce-add, avoiding
    the precision conversion and extra data movement that mixed-precision outlier handling
    normally incurs.
