  tldr: >
    OA-EM tackles why additive (codebook) quantization tends to collapse at 2 bits per weight.
    The authors argue the real culprit is not the search or the finetuning but the starting
    point: the standard greedy, sequential way of laying down the first codebook drops the model
    into a poor region that later beam search and PV-tuning cannot climb out of. They introduce
    a representational ratio that relates how many weight groups must be encoded to how much
    capacity the codebooks actually have, and use it to reason about when initialisation matters
    most. Their fix replaces greedy placement with an EM procedure that assigns weight groups to
    codebook entries using a Hessian-weighted Mahalanobis distance, so the initialisation
    accounts for how much each weight affects the layer output. On small Llama and Qwen models
    this lowers 2-bit perplexity noticeably while keeping the same fast lookup-table inference
    as AQLM.
  key_idea: >
    Additive quantization represents each weight group as a sum of M codebook entries; the
    quality of the final solution is largely fixed by the initial codebook. OA-EM frames
    initialisation as a clustering/assignment problem solved by Expectation-Maximization, where
    the distance used to assign a weight group to a codebook centroid is a Hessian-weighted
    Mahalanobis distance (output-aware), rather than plain Euclidean distance over raw weights.
    This biases the initial codebook toward minimizing the layer's output reconstruction error,
    placing the model in a better optimisation basin before the usual beam-search code updates
    and PV-tuning finetuning are applied. The authors analyse this through the representational
    ratio rho = N/(K*M), which characterizes the tension between the number of weight groups and
    the codebook capacity.
