  tldr: >
    WindowQuant compresses the key-value cache for video-language models, where the KV cache is
    dominated by large numbers of visual tokens. Instead of quantizing every token uniformly or
    token-by-token, it groups tokens into fixed-size windows and assigns each window a bit-width
    based on how similar that window's visual content is to the text prompt, so windows that
    matter more for the answer are kept at higher precision and less relevant windows are
    compressed harder. To keep the resulting mixed-precision layout fast on hardware, it
    reorders the cache windows so that windows sharing the same bit-width are computed together,
    avoiding the irregular memory access that usually makes mixed-precision slow. The method is
    post-training and only needs a small calibration sample to set the similarity-based
    thresholds.
  key_idea: >
    WindowQuant has two parts. (1) Window-level quantization search: visual tokens are split
    into windows (default 32 tokens); a similarity score between each window and the text prompt
    is computed, and windows are assigned bit-widths (e.g. INT2 vs INT4, with the most important
    content kept at FP16) so that more text-relevant windows receive higher precision under an
    average-bit budget (~3.17 bits). Quantization within a window is asymmetric group-wise
    round-to-nearest with per-group scale and zero-point. (2) Window-level KV cache computation:
    before attention, windows are reordered so windows of the same precision are contiguous,
    eliminating the hardware inefficiency (irregular access, branch divergence) that normally
    penalizes mixed-precision KV caches, which yields roughly 3x decoding throughput and several
    GB of memory savings.
