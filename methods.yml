  venue: null
  precision: "W2/W4/W8 A16 (q2_k, q4_k_m, q8_0) and f16; supports 21 GGUF quantization formats"
  granularity: "per-block (GGUF K-quant blocks); inherits llama.cpp/GGUF block layouts"
  calibration: "none (runtime; consumes pre-quantized GGUF weights)"
  symmetric: "mixed (depends on GGUF format)"
  handles_outliers_via: "n/a (runtime backend; relies on the chosen GGUF quantization format)"
  hardware_target: "WebGPU in the browser across vendors (tested on 16 devices from 8 GPU vendors)"
  requires_training: false
  requires_calibration_data: false
  typical_degradation: "n/a (inference runtime, no extra accuracy loss); 54% higher decode throughput than WebLLM and 69% higher than Transformers.js, and ~49% lower memory than WebLLM, measured on 10 models including Llama3.2-1B, Qwen3-0.6B, Gemma3-270M, and SmolLM3-3B"
  tldr: >
    LlamaWeb is a WebGPU backend for llama.cpp that runs quantized language models entirely
    inside a web browser across GPUs from many different vendors. It cuts memory use by
    allocating all the GPU buffers it needs once at startup (instead of creating buffers on the
    fly) and by loading model weights efficiently, and it stays fast across very different
    hardware by generating its compute shaders from templates and auto-tuning parameters like
    workgroup and tile sizes per device. The same kernel templates are instantiated for each
    weight format, so the engine can read many GGUF quantization layouts (2-bit through 8-bit
    K-quants plus f16) and be extended to new ones without hand-writing a separate kernel each
    time. In browser benchmarks it decodes tokens faster and uses less memory than WebLLM and
    Transformers.js, though its prefill phase is slower than WebLLM's.
  key_idea: >
    LlamaWeb adds a WebGPU device backend to llama.cpp built around three pieces: (1) static
    memory planning, where the full set of GPU buffers required to run a model is allocated up
    front into a single large buffer with fixed parameter slots, avoiding costly dynamic WebGPU
    buffer creation and reducing peak memory; (2) templated WGSL compute kernels parameterized
    over the weight format, so dequantization-plus-matmul shaders for the 23 supported formats
    are generated from shared templates rather than written individually; and (3) a tunable
    kernel library that exposes device-specific knobs (workgroup sizes, shared-memory tile
    sizes) whose best values are found by exhaustively sweeping thousands of configurations
    across many GPUs, giving performance portability across heterogeneous browser hardware.
  builds_on: ["llama-cpp", "gguf-kquants"]
  superseded_by: []
  related: ["mlc-llm", "gguf-iquants"]
