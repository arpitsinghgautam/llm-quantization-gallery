    OSC is a post-training 4-bit weight and activation quantization method that handles the
    activation outliers which normally break low-bit formats. It relies on the observation that
    the largest outliers sit in the same fixed set of channels across all tokens, so it profiles
    these channels offline and routes them through a separate high-precision path while
