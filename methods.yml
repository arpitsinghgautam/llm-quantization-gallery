- id: respinquant
  name: "ReSpinQuant"
  full_name: "ReSpinQuant: Efficient Layer-Wise LLM Quantization via Subspace Residual Rotation Approximation"
  category: ptq_weight_activation
  subcategory: "rotation-based"
  year: 2026
  date: 2026-04-13
  authors:
    - "Suyoung Kim"
    - "Sunghyun Wee"
    - "Hyeonjin Kim"
