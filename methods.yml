  handles_outliers_via: "second-order (inverse Hessian) error compensation, augmented with a compensation-aware error term; pairs with QuaRot rotation for 2-bit"
  hardware_target: "GPU; standard GPTQ/GPTAQ weight-only inference kernels"
  requires_training: false
