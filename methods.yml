    Three components work together. E2M-ATQ (Euclidean-to-Manifold Asymmetric Ternary Quantizer)
    ternarizes weights through a two-stage optimization, starting from a Euclidean-distance
    initialization and then relocating points on a manifold to minimize layer-output
    reconstruction error with an asymmetric ternary mapping. KOTMS (Kronecker Orthogonal Tri-
    Modal Shaping) applies a Kronecker-structured orthogonal rotation that pushes weights into a
    tri-modal distribution well-matched to ternary levels, and because the same rotation also
    acts on activations it statistically suppresses activation outliers. ILA-AMP (Inter-Layer
    Aware Activation Mixed Precision) allocates activation bits across layers by modeling
    adjacent-layer second-order interaction costs, accounting for how the shared rotation
    changes per-layer quantization gain and preventing error cascades from a few weak layers.
