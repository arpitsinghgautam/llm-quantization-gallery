- id: quantized-keys-steal-attention
  name: "QKSA"
  full_name: "Quantized Keys Steal Attention: Bias Correction for KV-Cache Compression in Video Diffusion"
  category: kv_cache
  subcategory: "softmax-bias-correction"
  year: 2026
  date: 2026-05-25
  authors:
    - "Tuna Tuncer"
    - "Felix Becker"
    - "Thomas Pfeil"
  affiliation:
    - "Recogni"
  paper_url: https://arxiv.org/abs/2605.26266
  code_url: null
  blog_url: null
  venue: "ICML 2026 Workshops (SCALE, F2S)"
  precision: "W16A16KV2"
  granularity: "per-token / per-group KV-cache quantization (granularity not explicitly fixed in abstract)"
  calibration: "none - correction is computed analytically on-the-fly from quantization step sizes and query norm"
  symmetric: "n/a"
  handles_outliers_via: "analytic per-attention-score additive correction that subtracts the softmax Jensen bias instead of suppressing outliers"
  hardware_target: "GPU (video diffusion inference; correction fuses into the attention kernel with negligible overhead)"
  requires_training: false
  requires_calibration_data: false
  typical_degradation: "at INT2 KV cache recovers most quality lost to quantization, approaching BF16 and outperforming INT4 at ~50% of its memory, on MAGI-1, SkyReels-V2, and HY-WorldPlay video diffusion models"
  tldr: >
    When the KV cache of a video diffusion model is quantized to very low bit-widths, the
    rounding noise on the cached keys does not average out inside the attention softmax. Because
    the softmax exponential is convex, the noise systematically inflates how much attention mass
    the quantized (past) keys receive, draining attention away from the unquantized current
    chunk. The authors call this the Jensen bias and show it is the main reason INT2 KV caches
    degrade. They derive a closed-form estimate of the bias from the key quantization step sizes
    and the query norm, then subtract it from each attention score before the softmax. The
    correction needs no extra memory, no calibration data, and no retraining, and adds almost no
    compute, letting INT2 KV caches reach near-BF16 video quality while beating INT4 at half the
    memory.
  key_idea: >
    For each attention score s_i = q . k_i, quantizing the key adds zero-mean noise, but the
    softmax weight exp(s_i) is convex, so E[exp(s_i + noise)] > exp(s_i) by a Jensen gap
    proportional to the score variance. The score variance is estimated analytically from the
    per-key quantization step size and the query vector norm, giving a second-order Taylor
    approximation of the bias for every cached key. This per-score correction term is subtracted
    from the logits before softmax so the inflated attention mass of quantized keys is removed,
    restoring the correct balance between past (quantized) and current (full-precision) tokens.
    The whole correction is data-free and computed on-the-fly at inference time.
  builds_on: ["kivi"]
  superseded_by: []
  related: ["kvquant", "kivi", "sageattention"]
  diagram: assets/diagrams/quantized-keys-steal-attention.svg
  diagram_caption: "Convex softmax inflates quantized-key attention mass (Jensen bias); an analytic per-score correction from key step size and query norm cancels it before softmax."

