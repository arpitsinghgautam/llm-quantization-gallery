  tldr: >
    SplitQ is a post-training quantization method aimed at vision-language models, where the
    activations coming from text tokens and from image tokens have very different statistics.
    The authors observe that the extreme-valued (outlier) channels for the two modalities sit in
    different places, so treating all channels uniformly hurts low-bit accuracy. SplitQ first
    sorts channels into groups that are shared, text-only, or vision-only based on per-modality
    scoring, and handles each group's outliers separately. It then attaches two small learnable
