  tldr: >
    This work studies why MXFP4 4-bit quantization hurts reinforcement-learning post-training of
    LLMs and splits the quantization error into three separate causes. The first is a scale bias
    from rounding each block's shared scale to a power of two, which compounds through the
    backward pass and corrupts gradients. The second is a deadzone effect where small values get
    zeroed out, which lowers the quality of generated rollouts. The third is grid noise from
    snapping values to the nearest 4-bit level, which inflates the policy's entropy. For each
    cause the authors apply a matching fix (a finer macro-block scale, a fallback path that
    keeps a few important entries at higher precision, and an adaptive injected-noise term), and
    report that the combined recipe brings a quantized RL run back to BF16-level results on
    Qwen2.5-3B and slightly past it on a 30B MoE model.
  key_idea: >
    The paper decomposes MXFP4 error during RL training into three components. (1) Scale bias
    from E8M0 power-of-two rounding of the per-block scale accumulates multiplicatively through
    backprop and degrades gradient accuracy; it is mitigated by macro-block scaling that uses a
    finer/higher-precision scaling factor across blocks. (2) Deadzone truncation zeros out small
    magnitudes and lowers rollout quality; it is recovered by an outlier-fallback path that
    retains the affected (and large) entries at higher precision, which also partially offsets
    the scale bias. (3) Grid noise from nearest-4-bit rounding raises policy entropy; it is
    controlled by adaptive quantization noise (AQN) that shapes the injected rounding noise. A
    residual 'irreducible floor' remains after all three corrections.
