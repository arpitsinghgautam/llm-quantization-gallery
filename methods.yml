  hardware_target: "GPU; standard symmetric scalar layers compatible with existing scalar inference kernels (e.g. Humming kernels on NVIDIA L40s, up to ~6.2x speedup over BF16 at 2-bit)"
  requires_training: false
  requires_calibration_data: true
  typical_degradation: "On Llama-3.1-70B-Instruct at 2-bit, ~75.6% average zero-shot accuracy across ARC-C/ARC-E/HellaSwag/PIQA/WinoGrande, vs ~77.3% for QTIP (vector quant) and ~71.4% for EfficientQAT (scalar); closes most of the scalar-to-VQ gap at 2-3 bits"
  tldr: >
    GSQ is a weight-only, post-training quantizer that keeps weights on a plain symmetric scalar
    grid (so it runs on ordinary integer matmul kernels) but learns where each weight lands and
    how each group is scaled, instead of just rounding. Starting from a GPTQ solution, it treats
    the choice of grid point for each weight as a discrete decision and relaxes that decision
    with a Gumbel-Softmax so it can be tuned by gradient descent against calibration data,
    jointly with the per-group scales. The goal is to get close to the accuracy of much heavier
    vector- and trellis-quantized methods at 2 and 3 bits while staying simple to deploy. The
    authors show it holds up on Llama-3.1-8B/70B and even scales to a trillion-parameter
    Mixture-of-Experts model (Kimi-K2.5) where vector quantization is hard to apply.
  key_idea: >
    Each weight's assignment to one of the 2^b symmetric grid levels is modeled as a categorical
    variable; a Gumbel-Softmax relaxation makes these discrete assignments differentiable, so
    the per-coordinate level choices and the per-group scales are optimized jointly by gradient
    descent on a calibration objective. Optimization is warm-started from a GPTQ solution and a
    temperature schedule anneals the soft assignments toward hard (one-hot) grid choices by the
    end of training. Because the output is a standard symmetric per-group scalar quantization,
    no special vector-quantization codebooks or custom decode kernels are needed at inference.
    This lets GSQ approach the accuracy of QTIP/AQLM-style vector quantization at 2-3 bits while
    remaining a scalar format.
