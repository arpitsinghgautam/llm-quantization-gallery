  typical_degradation: "PixArt-Sigma SINT4 (20 steps): FID 16.9, ImageReward 0.898, LPIPS 0.309 on MJHQ; SANA-1.6B SINT4: FID 16.1, ImageReward 1.09, LPIPS 0.182 on MJHQ"
  tldr: >
    LoRaQ quantizes large diffusion transformers to 4-bit by attaching a small low-rank linear
    branch alongside each quantized layer to soak up the error introduced by rounding the main
    weights. Unlike earlier low-rank-compensation schemes that keep this auxiliary branch in
    16-bit precision and need a calibration dataset to initialize it, LoRaQ computes the branch
    factors in closed form without any data and then quantizes the branch itself down to 8-, 6-,
    or 4-bit. The result is a pipeline where every part runs below 16 bits while preserving
    image quality. On PixArt-Sigma and SANA, it matches or beats prior low-rank methods at the
    same memory budget.
  key_idea: >
    For each linear layer, LoRaQ models the quantization residual W - Q(W) and fits a low-rank
    approximation U V^T to it in closed form (data-free), so the branch output U V^T x
    compensates the error of the quantized main path Q(W) x. Because the compensation is derived
    analytically rather than calibrated on data, the low-rank factors can themselves be
    quantized (W8A8, W6A6, or W4A8) without re-introducing large error, removing the high-
    precision (W16A16) branch assumed by prior work and yielding a fully sub-16-bit forward
    pass. It additionally adopts SmoothQuant-style activation smoothing and optimizes rotations
    between the low-rank factors to better condition the residual before quantization.
