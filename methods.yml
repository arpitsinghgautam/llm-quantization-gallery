  tldr: >
    VeriCache makes lossy KV-cache compression produce exactly the same tokens as full-precision
    decoding. The problem it targets is that token-dropping and KV quantization methods drift
    further from the full-cache output the longer a model generates, which breaks long outputs
    like code and tool-call sequences. VeriCache borrows the draft-and-verify pattern from
    speculative decoding: it cheaply drafts tokens using a compressed KV cache kept in GPU
    memory, then verifies those drafts against a full KV cache that lives off the GPU (in CPU
    memory or on disk). Because drafting is HBM-bandwidth-bound and the full-cache swap is
    PCIe/network-bound, the two are run in parallel so verification overhead is largely hidden,
    recovering much of the throughput of the underlying compression method while guaranteeing
    identical results.
  key_idea: >
    The compressed KV cache (any token-dropping or quantization scheme exposed through a uniform
    compressor interface) drafts a window of candidate tokens. The full KV cache, stored off-GPU
    to save HBM, is streamed back in to recompute attention and verify the drafts in a single
    batched forward pass, accepting the longest correct prefix exactly as in speculative
    decoding so the final output is provably identical to full-KV decoding. The core systems
    contribution is overlapping the HBM-bandwidth-bound compressed-KV drafting with the
    PCIe/network-bandwidth-bound full-KV swap-in, plus scheduling that minimizes the cost of
    bringing the full cache on-chip only for verification.
