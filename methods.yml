  tldr: >
    SAGE-PTQ is a weight-only post-training method that pushes average storage down to about
    1.03 bits per weight by attacking an overlooked cost: the bits spent on quantization scales
    themselves. It splits each weight matrix into a small salient set and a large unsalient set
    using distributional statistics, keeps the salient weights at a few bits of precision (2 to
    4), and binarizes everything else. To keep scale overhead near zero it uses just one per-
    channel scale for the salient weights and a single scalar per unsalient binary group, and it
    picks how many groups each layer needs by treating subsampled unsalient weights as a sparse
    graph. An adaptive threshold sets the salient ratio separately for each matrix. The result
    is a 1-bit-class quantizer that reports much lower perplexity than prior binary PTQ methods
    while adding almost no metadata.
  key_idea: >
    The method observes that ultra-low-bit quantizers spend a non-trivial fraction of their
    storage on per-group scaling factors, so it minimizes that hidden cost rather than only the
    weight bits. Weights are partitioned into salient and unsalient sets via distributional
    statistics, with an adaptive per-matrix saliency threshold choosing the salient ratio (often
    around 1%). Salient weights get multi-bit precision (4-bit in outlier-heavy early layers,
    2-bit later) sharing a single per-channel scale, while unsalient weights are binarized and
    share one scalar per group. The number of unsalient groups per layer is estimated by
    modeling subsampled unsalient weights as a sparse graph, balancing reconstruction accuracy
    against the scale budget so the combined cost lands near 1.03 weight bits plus ~0.004
    scaling bits per matrix.
