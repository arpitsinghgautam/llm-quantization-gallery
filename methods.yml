  diagram_caption: "XFP: split weights into sparse fp16 outliers plus sub-byte indices into a Lloyd-learned codebook, sized automatically to meet a per-channel cosine-similarity quality floor."

- id: qam-w
  name: "QAM-W"
  full_name: "QAM-W: Joint 2D Codebook Quantization for LLM Weights via Hadamard Rotation and Activation-Aware Scaling"
  category: ptq_weight_only
  subcategory: "2d-codebook"
  year: 2026
  date: 2026-05-25
  authors:
    - "Preetam Sharma"
    - "Kacper Dobek"
  affiliation:
    - "Independent Research"
    - "Institute of Computing Science, Poznan University of Technology"
  paper_url: https://arxiv.org/abs/2605.26339
  code_url: null
  blog_url: null
  venue: null
  precision: "W5.5A16"
  granularity: "per-row normalization + block-Hadamard rotation, then 2D-pair codebook; per-channel activation-aware scaling"
  calibration: "up to 1024 unit-normalized rows per weight matrix for pair-scale (sigma_k) estimation; AWQ-style per-channel scale from layer-input RMS statistics"
  symmetric: "symmetric"
  handles_outliers_via: "row L2-normalization and block-Hadamard rotation to Gaussianize/spread coordinates, plus AWQ-style activation-aware per-channel scaling"
  hardware_target: "GPU storage-only (dequantizes to BF16 before matmul; no fused dequant-matmul kernel yet)"
  requires_training: false
  requires_calibration_data: true
  typical_degradation: "within +-0.4% of BF16 WikiText-2 perplexity at ~5.5 bpw across five models; e.g. Llama-2-7B +0.29% (4.7664 vs 4.7527 BF16), Mistral-7B +0.1%, Qwen2.5-3B +0.3%, TinyLlama-1.1B +0.4%"
  tldr: >
    QAM-W is a weight-only post-training quantization codec that treats pairs of weights as 2D
    points and codes them jointly instead of one scalar at a time. Each weight row is first
    L2-normalized (the 16-bit norm is stored as side information), then passed through a block-
    Hadamard rotation so the coordinates look like samples from a circular Gaussian. Adjacent
    coordinates are grouped into 2D pairs and quantized against a single Lloyd-Max codebook
    trained on that unit circular Gaussian, with an AWQ-style per-channel scale applied so that
    channels feeding large activations get finer resolution. At roughly 5.5 bits per weight the
    activation-aware variant stays within about 0.4% of BF16 WikiText-2 perplexity on five
    models from 1.1B to 13B parameters, reaching SmoothQuant W8A8 quality at around 32% fewer
    weight bits. The current implementation only reduces storage, dequantizing to BF16 before
    the matmul.
  key_idea: >
    Rather than scalar-quantizing each weight independently, QAM-W exploits 2D structure: per-
    row L2 normalization plus a block-Hadamard rotation reshapes weight distributions toward an
    isotropic Gaussian, after which consecutive coordinates are paired into 2D points and
    quantized with a shared Lloyd-Max codebook optimized for the unit circular Gaussian. A per-
    pair scale sigma_k (estimated from up to 1024 calibration rows) plus an AWQ-style per-
    channel activation-aware scale (exponent alpha=0.3, grid-tuned not learned) allocate
    codebook resolution to the channels that matter most for layer output. Joint 2D coding beats
    polar (amplitude x phase) coding by 2-15 perplexity points at equal bitrate. Bits-per-weight
    follows bpw = B/2 + 16/d_in, where B is bits per pair and 16 bits/row store the norm.
  builds_on: ["awq", "quip-sharp", "quarot", "squeezellm"]
  superseded_by: []
  related: ["qtip", "aqlm", "smoothquant", "quip"]
  diagram: assets/diagrams/qam-w.svg
  diagram_caption: "QAM-W: row-normalize -> block-Hadamard rotate -> pair into 2D coordinates -> joint Lloyd-Max codebook quantization with activation-aware per-channel scaling."

