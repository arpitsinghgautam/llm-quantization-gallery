  tldr: >
    WINDQuant frames ultra-low-bit weight quantization as a budget-constrained allocation
    problem and solves it with a reinforcement-learning controller. Instead of designing a new
    low-level quantization operator, it learns which bit-widths and quantization treatments to
    give to fine-grained column chunks of each weight matrix, subject to a single global storage
    budget. The controller is trained with PPO using activation-aware calibration, and each
    chosen chunk is fit with a lightweight per-unit quantizer. This lets precision vary inside a
    layer so that more sensitive chunks keep more bits while robust chunks are squeezed harder,
    reaching roughly 2-bit average storage on LLaMA models without retraining the network
    itself.
  key_idea: >
    A PPO policy treats bit-width and quantization-treatment selection for each column chunk
    (default chunk size G=256 weights) as a sequence of decisions made under a global effective-
    bit budget. State features capture weight statistics and activation-aware sensitivity from a
    small calibration set; the action assigns a per-chunk plan whose cost is tracked by explicit
    effective-bit accounting so the total stays within the target average bit-width. The reward
    combines an episode-end quality penalty, per-step budget shaping, and perplexity-ratio
    penalties, steering the controller toward allocations that minimize accuracy loss at the
    budget. After the plan is decided, each unit is fit with a lightweight local quantizer
    rather than retraining model weights, keeping optimization cost far below QAT.
