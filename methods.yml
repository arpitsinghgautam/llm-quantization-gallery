  tldr: >
    This method adds a single math-preserving preprocessing step in front of an off-the-shelf
    weight-only quantizer (Intel AutoRound). For each linear layer it applies a Walsh-Hadamard
    rotation to the weight matrix and then rescales the matrix columns according to how much
    activation energy each coordinate carries in the Walsh basis, an importance signal borrowed
    from Boolean-function influence analysis. The effect is to push the rounding budget toward
    the coordinates that matter most, so that when AutoRound quantizes the rotated-and-scaled
    weights down to 2 bits, the reconstruction error lands on the least important directions.
    Because the transform is invertible, accuracy is unchanged in full precision, and the
    quantized weights export to OpenVINO IR and run identically on Intel CPU, NPU, and Arc GPU.
