  tldr: >
    BiLLM achieves state-of-the-art 1-bit post-training quantization of LLMs using a
    Hessian-based binarization strategy. Unlike random or magnitude-based binarization,
    BiLLM selects the binary weight values (per column scale + sign) to minimize the
