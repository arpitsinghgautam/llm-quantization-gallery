  typical_degradation: "GPTQ+CAE cuts Llama2-7B 3-bit C4 perplexity from 13.60 to 8.34; GPTAQ+CAE reaches 8.19 (vs 8.40); 2-bit + QuaRot on Llama2-13B: WikiText-2 7.32 vs 7.50 for GPTAQ"
  tldr: >
    This work re-examines how iterative weight-compensation quantizers like GPTQ and GPTAQ
    define the error they try to cancel. The authors point out that when these methods quantize
    a layer column by column, they line up the quantized output with the output of the already-
    compensated weights instead of the original full-precision weights, which is the wrong
    target. They reframe the objective to always match the true full-precision output, and show
    this introduces an extra error source they call the compensation-aware error: the gap
    between compensated and original weights inside the same layer. Folding this term into the
    column update (reusing GPTAQ's neuron-decomposition trick) costs only about 5 percent more
    quantization time and noticeably improves accuracy, with the biggest gains showing up at
    3-bit and 2-bit weight-only settings.
  key_idea: >
    Existing compensation-based PTQ aligns each column's quantized output against the running
    compensated weights, not the original full-precision weights, which the authors argue is a
    sub-optimal calibration objective. They redefine the per-step objective to align the
    quantized output directly with the original full-precision output, exposing a second
    residual-error source beyond the usual cross-layer output difference: the discrepancy
    between compensated and original weights within the layer, named the compensation-aware
    error. Using GPTAQ's neuron-decomposition, this extra term is incorporated efficiently into
    the standard inverse-Hessian column update with minimal overhead. The enhancement is drop-in
    for both GPTQ and GPTAQ and is combined with QuaRot rotation for 2-bit settings.
