  symmetric: "symmetric"
  handles_outliers_via: "important/uncertain tokens are kept at higher precision (8-bit or FP16) by the controller; low-importance tokens dropped to 2/4-bit"
  hardware_target: "on-device / edge (memory- and bandwidth-constrained); evaluated on small SmolLM models"
