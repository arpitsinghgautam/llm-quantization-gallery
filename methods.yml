  tldr: >
    FAIR-Calib is a post-training quantization recipe built specifically for diffusion language
    models, which generate text by iteratively refining masked tokens and then irreversibly
    commit them. The authors observe that low-bit quantization can flip borderline token choices
    right at the model's write frontier, and because those choices get locked in, the error
    propagates through the rest of the sequence. The method first probes a full-precision
    teacher to learn which token positions are most fragile, then runs a layer-wise calibration
    that weights the per-position reconstruction error so that fragile frontier positions are
    protected more strongly. It works at W4A4 for both weights and activations and avoids
    running full diffusion rollouts during calibration.
