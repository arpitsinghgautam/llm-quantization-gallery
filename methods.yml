  tldr: >
    LFQ is an add-on for block-wise weight-only post-training quantization that targets the
    quality drop low-bit LLMs suffer on open-ended generation and long chain-of-thought tasks.
    The authors observe that standard block reconstruction has two blind spots: it never
    optimizes the final unembedding (LM head) layer, and it uses a mean-squared-error objective
    that does not directly preserve the model's output token distribution. LFQ fixes this by
    treating the last transformer block together with the LM head as one unit and tuning its
    quantized weights to match the full-precision logits via a cross-entropy objective instead
    of MSE. The change keeps perplexity and multiple-choice accuracy roughly unchanged while
    recovering accuracy on generation-heavy benchmarks.
