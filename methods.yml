  tldr: >
    STaR-Quant is a post-training quantization recipe aimed specifically at diffusion language
    models (DLLMs), which produce text by iteratively un-masking tokens rather than decoding
    left to right. The authors observe two problems that ordinary LLM quantizers miss: masked
    and unmasked tokens have very different activation ranges within a single denoising step,
    and small quantization errors compound over the many denoising iterations. To handle the
    first, masked and unmasked tokens are routed through separate activation transformation
    spaces while sharing one static weight-side transform, so a single quantized weight matrix
    still serves both. To handle the second, a lightweight block-diagonal affine correction is
    applied to the quantized attention to keep the attention output close to its full-precision
    counterpart across steps. The method needs only a small calibration set and no fine-tuning,
    and targets 4-bit weight and 4-bit activation deployment.
  key_idea: >
    STaR-Quant tackles two failure modes unique to masked-denoising diffusion LLMs. State-Guided
    Activation Transformation (SGAT) assigns masked and unmasked tokens to distinct activation
    transformation spaces (since their distributions differ within a step) but pairs them with
    one shared static weight-side transformation, so weights remain singly quantized while
    activations are normalized per state. Temporal Attention Compensation (TAC) then corrects
    the quantized attention representation through a lightweight block-diagonal affine mapping,
    counteracting the error that otherwise accumulates over the iterative denoising trajectory.
    Together these enable W4A4 weight-activation quantization with per-token activation and per-
    channel weight scales, asymmetric, calibrated on 128 WinoGrande segments without any
    gradient training.
