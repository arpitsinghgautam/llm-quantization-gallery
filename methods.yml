    InfoQuant recasts activation transformation as quantizer-facing distribution design. An
    information-theoretic analysis of uniform-quantizer error shows that quantization-friendly
    activations should jointly minimize numerical range and maximize normalized dispersion
    within that range. To produce such distributions it introduces Peak Suppression Orthogonal
    Transformation (PSOT): orthogonal matrices optimized with a peak-suppression objective that
    reduces the activation range while increasing dispersion, kept matmul-preserving so they
    fold into adjacent weights offline. An adaptive outlier-token selection scheme identifies
    and discounts the most disruptive tokens during PSOT optimization to make the fit robust,
    and a learnable activation clipping step (LAC) further tunes the quantization range. Weights
    are quantized per-channel with GPTQ.
