  tldr: >
    This is a post-training quantization method aimed at visual autoregressive (VAR) image
    generators rather than language models. The authors notice two problems unique to VAR: the
    attention-value products carry large quantization error at coarse generation scales where
    attention concentrates on a few value tokens, and the calibration set under- or over-
    represents certain codebook entries relative to how often the model actually predicts them.
    To fix the first, they make extra copies of the value tokens that receive high attention,
    nudge each copy by a small symmetric offset above and below the original value, quantize all
    of them, and average the results so the rounding errors cancel out. To fix the second, they
    resample the calibration tokens so that each VQVAE codebook entry appears in proportion to
    its predicted probability. The method needs only calibration data and no retraining, and it
    works across VAR depths on class-conditional generation, inpainting, outpainting, and
    editing.
  key_idea: >
    For value tokens v that attract large attention weights, the method creates K symmetrically
    shifted duplicates v ± kΔ around the original value, quantizes each duplicate independently,
    and sums/averages the dequantized results; because the shifts are symmetric, the per-
    duplicate rounding errors are anti-correlated and largely cancel, yielding a lower-error
    estimate of the attention-value product than quantizing v once. The weights and remaining
    activations are quantized with standard uniform symmetric grids at 4-6 bits. A complementary
    resampling calibration step reassigns tokens from over-sampled to under-sampled codebook
    entries so the calibration statistics match the model's predicted token distribution, which
    improves activation range estimates. The whole pipeline is post-training (calibration only,
    no gradient updates).
