  symmetric: "asymmetric"
  handles_outliers_via: "online per-head per-step error bounds drive adaptive precision and a multi-stage fallback ladder that can recover exact FP16 attention from RAM-resident originals"
  hardware_target: "GPU (quantized KV in GPU memory) with FP16 originals retained in system RAM"
  requires_training: false
  requires_calibration_data: false
  typical_degradation: "Matches dense FP16 KV within noise on PG-19 (language modelling) and NIAH/RULER (retrieval) for LLaMA-3.1-8B at contexts up to 128K; recovers catastrophic failures seen in naive INT8/INT4 baselines. Value-sensitive short-context tasks show a controlled compression/fidelity trade-off, removable via tighter value tolerances or FP16-value fallback."
  tldr: >
    This work treats KV-cache quantization as a computation that is checked at run time rather
    than trusted blindly. Keys are stored as INT8 and values as INT4 in GPU memory, while the
    original FP16 keys and values are kept in ordinary system RAM. For every attention step and
    every head, the method computes two error quantities online: how much the quantized keys
    distort the attention weight distribution, and how much the quantized values distort the
    reconstructed output. These computed bounds decide, on the fly, whether the quantized result
    is acceptable or whether the system should climb a ladder of fallback options, ending if
    necessary in an exact attention recomputation using the FP16 originals from RAM. The aim is
    not faster inference but safe deployment of aggressive KV compression: each attention result
    is guaranteed to be either within a known bound of the FP16 reference or exactly recovered.
  key_idea: >
    A tiered KV cache stores INT8 keys and INT4 values on the GPU while the FP16 originals stay
    in system RAM as a deterministic fallback source. A two-term error decomposition gives per-
    head, per-step bounds on (i) attention-distribution distortion caused by key quantization
    and (ii) value reconstruction error. These bounds are evaluated online and used both to
    select precision adaptively and to trigger a multi-stage fallback ladder; when a bound is
    exceeded the system escalates, ultimately recomputing the exact dense attention output from
    the RAM-resident FP16 originals. The certification is local (per-head, per-step): it
    guarantees each attention computation is either bounded relative to an FP16 reference or
    exactly recovered, rather than guaranteeing end-to-end model correctness.
