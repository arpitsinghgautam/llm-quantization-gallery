  tldr: >
    BWLA is a post-training quantization recipe that pushes weights down to a single bit while
    also lowering activations to around 6 bits, so that both sides of each matrix multiply run
    in low precision and the whole layer actually speeds up rather than being bottlenecked by
    full-precision activations. The challenge it targets is that binary-weight methods usually
    have to keep activations in high precision because of their heavy-tailed distributions; BWLA
    instead applies a learned orthogonal transform that reshapes the weight distribution into a
    symmetric two-peak form (which binarizes cleanly) and at the same time flattens the
    activation tails. A second low-rank correction step recovers extra accuracy at little cost.
    The result is usable 1-bit-weight, low-bit-activation models without any retraining.
  key_idea: >
    The Orthogonal-Kronecker Transformation (OKT) learns an orthogonal mapping, parameterized in
    Kronecker-factored form for efficiency, by minimizing an objective via expectation-
    maximization. Applied to the weights it converts their unimodal distribution into a
    symmetric bimodal shape that is well matched to 1-bit binarization, while the same rotation
    applied to the activation path suppresses heavy tails and reduces incoherence so activations
    can be quantized to low bits. The Proximal SVD Projection (PSP) then performs a lightweight
    low-rank refinement through proximal SVD projection to further improve quantizability with
    minimal overhead. The whole pipeline is post-training (no gradient fine-tuning) and uses a
    small Wikitext2 calibration set.
