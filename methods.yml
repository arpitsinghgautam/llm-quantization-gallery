  tldr: >
    TWLA is a post-training quantization recipe that compresses large language models down to
    ternary (1.58-bit) weights paired with 4-bit activations, so both sides of every matrix
    multiply run in low precision rather than keeping activations in high precision. It tackles
    three obstacles at once: ternarizing weights without exploding layer output error, reshaping
    weight distributions so ternary values fit them well while also taming activation outliers,
    and deciding how many activation bits each layer needs. The result is a fully low-bit
    pipeline that keeps accuracy close to higher-precision baselines while enabling faster end-
    to-end inference, without any gradient retraining.
