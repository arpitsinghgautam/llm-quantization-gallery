  calibration: "data-free closed-form optimization of the low-rank compensation factors (no calibration set); adopts SmoothQuant-style activation smoothing as a complementary step"
  symmetric: "symmetric"
  handles_outliers_via: "low-rank auxiliary branch that absorbs the high-magnitude quantization-error components, combined with activation smoothing and rotation between the low-rank factors"
  hardware_target: "GPU / resource-constrained accelerators"
