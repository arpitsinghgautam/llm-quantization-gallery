  tldr: >
    InfoQuant is a training-free post-training method for running LLMs with 4-bit weights,
    activations, and KV cache. Its starting point is that simply making activations look
    numerically smoother does not make them easy to quantize: a low-bit uniform grid wastes
    precision when the range stays wide or when most values pile up near the mean. The authors
    analyze quantization error from an information-theoretic angle and argue that good
    activations need both a tighter range and enough spread across that range. They then apply
    learned orthogonal transformations to reshape activations toward that target before
    quantizing, with an extra step that decides which outlier tokens to down-weight while
    fitting the transforms so the fit stays stable. The transforms are orthogonal, so they can
    be folded into the surrounding weight matrices and add no extra inference cost.
