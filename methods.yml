  handles_outliers_via: "Diagonal Hessian importance weighting that prioritizes preservation of salient feature power; off-diagonal (cross-channel) curvature terms are discarded as noise rather than using a separate outlier path"
  hardware_target: "GPU (general weight-only inference); no custom kernel introduced"
  requires_training: false
  requires_calibration_data: true
  typical_degradation: "At 2-bit weight-only on Llama-3.1-8B: 56.52% average zero-shot accuracy across 8 tasks (ARC-C/E, BoolQ, HellaSwag, OBQA, PIQA, SIQA, Winogrande), reported as +14.01% over the strongest baseline and +7.01% average improvement across five models (Llama-3.1-8B, Qwen3-14B, DeepSeek-MoE-16B, Phi-3.5-MoE, Mixtral-8x7B); up to 74.5x faster quantization than optimization-based PTQ baselines"
  tldr: >
    DASH-Q is a weight-only post-training quantization method aimed at very low bit-widths (2 to
    4 bits) when only a small amount of calibration data is available. Other curvature-based
    methods estimate a full Hessian to compensate quantization error across channels, but with
    limited calibration samples those cross-channel estimates become noisy and hurt accuracy at
    low bit-widths. DASH-Q keeps only the diagonal of the Hessian, treating each weight column
    independently, and solves an iterative weighted least squares problem so that columns
    carrying more signal power are preserved more carefully. The result is a quantizer that
    stays stable with few calibration samples and runs much faster than optimization-heavy
    alternatives, while improving accuracy in the 2-bit regime.
  key_idea: >
    The method replaces the full Hessian H used in OBS/OBC-style error compensation with its
    diagonal D = diag(h11, h22, ...), which decouples the coupled second-order optimization into
    independent per-column weighted least squares subproblems that have closed-form solutions.
    The diagonal weights act as importance scores that emphasize columns with high feature
    power, while discarding noise-prone off-diagonal dependencies that are poorly estimated from
    limited calibration data. Quantization uses asymmetric affine group-wise rounding (group
    sizes 32/64/128 for 2/3/4-bit), and the weighted least squares step is applied iteratively
    to refine the assignment without any retraining.
  builds_on: ["obs", "obq", "gptq"]
  superseded_by: []
  related: ["awq", "quip", "owq", "spqr", "squeezellm", "rtn", "quarot"]
